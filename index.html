<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brawler</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--yellow:#facc15;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:24px}
  h1{font-size:clamp(32px,8vw,56px);margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--yellow);text-shadow:0 3px 0 #92400e}
  .panel{background:var(--panel);border-radius:16px;padding:16px}
  #arena{width:100%;aspect-ratio:8/5;display:block;border-radius:12px;background:#14532d;touch-action:none;cursor:crosshair}
  .bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .bar .who{font-weight:800}
  button{font:inherit;color:inherit;border:0;touch-action:manipulation;cursor:pointer}
  .act{font-weight:800;border-radius:12px;padding:12px 20px;color:#fff}
  #atk{background:var(--red)}
  #sup{background:#475569}
  #sup.ready{background:var(--yellow);color:#422006}
  .act:active{transform:translateY(1px)}
  .hint{color:var(--muted);font-size:13px;flex-basis:100%}
  .rarity{display:grid;gap:12px}
  .rarity h2{margin:0;display:flex;align-items:center;gap:10px;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
  .rarity h2 span{font-size:13px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .brawler{background:var(--panel);border-radius:16px;padding:14px;text-align:left;display:grid;gap:8px;border:3px solid transparent;border-top:6px solid var(--c)}
  .brawler:hover{background:#273449}
  .brawler.sel{border-color:var(--c);border-top-width:6px}
  .brawler{min-width:0}
  .brawler .pic{min-width:0}
  .brawler canvas,.brawler .pic img{width:100%;max-width:100%;height:auto;aspect-ratio:300/130;background:#14532d;border-radius:10px;display:block}
  .brawler h3{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
  .brawler h3 small{font-size:12px;color:var(--muted);font-weight:600}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .mini b{display:block;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0}
  .move{font-size:13px;color:var(--muted);line-height:1.35}
  .move strong{color:var(--yellow)}
  .note{color:var(--muted);font-size:12px;margin:0}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top h1{margin-right:auto}
  .coins{background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:800;font-size:18px;white-space:nowrap}
  .menu-btn{background:#7c3aed;color:#fff;font-weight:800;border-radius:12px;padding:12px 20px}
  #menu{position:fixed;inset:0;z-index:10;background:rgba(15,23,42,.96);overflow-y:auto;overscroll-behavior:contain}
  #menu[hidden]{display:none}
  .menu-in{max-width:960px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
  .menu-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:rgba(15,23,42,.96);padding:8px 0;z-index:1}
  .menu-head h2{margin:0 auto 0 0;font-size:clamp(24px,6vw,36px);color:var(--yellow);text-transform:uppercase}
  .close{background:#475569;color:#fff;font-weight:800;border-radius:12px;padding:10px 16px}
  .pic{position:relative}
  .pic .lock{position:absolute;inset:0;display:none;place-items:center;font-size:34px}
  .brawler.locked .pic canvas,.brawler.locked .pic img{filter:grayscale(1) brightness(.45)}
  .brawler.locked .pic .lock{display:grid}
  .brawler.owned{cursor:pointer}
  .brawler.owned:hover{background:#273449}
  .cta{white-space:nowrap;font-weight:800;border-radius:10px;padding:10px;width:100%;color:#fff;background:#475569}
  .cta.pick{background:#16a34a}
  .cta.cur{background:transparent;border:2px solid var(--c);cursor:default}
  .cta.buy{background:var(--yellow);color:#422006}
  .cta:disabled{background:#334155;color:#94a3b8;cursor:not-allowed}
  .stage{position:relative}
  #result{position:absolute;inset:0;display:grid;place-content:center;gap:10px;justify-items:center;text-align:center;background:rgba(15,23,42,.82);border-radius:12px;padding:16px}
  #result[hidden]{display:none}
  #result h2{margin:0;font-size:clamp(32px,8vw,56px);color:var(--yellow);text-transform:uppercase}
  #result p{margin:0;font-size:18px}
  #result .act{background:#16a34a}
  select{font:inherit;font-weight:700;color:#fff;background:#334155;border:0;border-radius:12px;padding:12px 14px}
  .tabs{display:flex;gap:8px}
  .tab{background:#334155;color:#cbd5e1;font-weight:800;border-radius:12px;padding:10px 22px}
  .tab.on{background:#7c3aed;color:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips[hidden]{display:none}
  .chip{background:#1e293b;color:#cbd5e1;font-weight:700;border-radius:999px;padding:6px 14px;border:2px solid var(--c)}
  .chip.on{background:var(--c);color:#0f172a}
  .mapgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .brawler.mapcard canvas{height:auto;aspect-ratio:8/5;background:none}
  .where{color:var(--muted);font-weight:600;font-size:13px}
  .hero{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:20px;align-items:center}
  @media (max-width:640px){.hero{grid-template-columns:1fr}}
  #hero{width:100%;height:auto;aspect-ratio:9/7;display:block;border-radius:14px}
  .eyebrow{margin:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .hero-info h2{margin:2px 0;font-size:clamp(28px,6vw,44px)}
  .hero-role{margin:0 0 12px;color:var(--muted)}
  .hero-info .mini{margin-bottom:10px}
  .hero-info .move{margin-top:4px}
  .start{display:block;width:100%;margin-top:18px;font-weight:900;font-size:clamp(24px,6vw,36px);padding:18px;border-radius:18px;
    background:linear-gradient(#fde047,#facc15);color:#422006;box-shadow:0 5px 0 #a16207;text-transform:uppercase;letter-spacing:.05em}
  .start:hover{filter:brightness(1.06)}
  .start:active{transform:translateY(3px);box-shadow:0 2px 0 #a16207}
  .lobby-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  #result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #result .act.alt{background:#475569}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;background:rgba(15,23,42,.96);color:#fde047;border:2px solid #facc15;border-radius:16px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  #toast[hidden]{display:none}
  .side-btn.gold{background:linear-gradient(#fde047,#f59e0b);border-color:#78350f;box-shadow:0 5px 0 #78350f}
  .side-btn.green{background:linear-gradient(#4ade80,#16a34a);border-color:#052e16;box-shadow:0 5px 0 #052e16}
  .home-left{display:grid;gap:12px}
  .pass-head,.quest{background:var(--panel);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
  .pass-head{border:3px solid #facc15;background:linear-gradient(135deg,#312e81,#1e293b)}
  .pass-head h3{margin:0;font-size:20px;color:#fde047}
  .pbar{height:16px;border-radius:8px;background:#0b1020;border:2px solid #000;overflow:hidden;position:relative}
  .pbar i{position:absolute;inset:0 auto 0 0;width:var(--p);background:linear-gradient(90deg,#a855f7,#facc15)}
  .pass-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:700}
  .passgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tier{background:var(--panel);border-radius:14px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;border:3px solid #334155;position:relative}
  .tier .no{position:absolute;top:-10px;left:-6px;background:#475569;color:#fff;border-radius:999px;font-weight:900;font-size:13px;padding:2px 10px;border:2px solid #0f172a}
  .tier .ico{font-size:34px;line-height:1.1;min-height:40px;display:grid;place-items:center}
  .tier canvas,.tier img{width:100%;max-width:100%;height:auto;aspect-ratio:300/130;border-radius:8px;background:#166534;display:block}
  .tier .txt{font-size:13px;font-weight:700;color:#e2e8f0;min-height:34px}
  .tier.can{border-color:#facc15;box-shadow:0 0 14px rgba(250,204,21,.45)}
  .tier.can .no{background:#facc15;color:#422006}
  .tier.done{opacity:.55}
  .tier.lock{filter:saturate(.5)}
  .tier .cta{padding:7px}
  .quests{display:grid;gap:12px}
  .quest h3{margin:0;font-size:18px}
  .quest .rew{display:flex;gap:8px;flex-wrap:wrap}
  .quest .rew span{background:#0f172a;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
  .quest .qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .quest .qrow .cta{width:auto;padding:9px 20px}
  .btns{display:grid;grid-template-columns:1fr auto;gap:8px}
  .cta.up{width:auto;background:#7c3aed;padding:10px 14px}
  .cta.up:disabled{background:#334155}
  .lvl{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--yellow)}
  .lvl i{display:block;height:6px;border-radius:3px;background:#0f172a;overflow:hidden;position:relative}
  .lvl i::after{content:'';position:absolute;inset:0 auto 0 0;width:var(--p);background:linear-gradient(90deg,#a855f7,#facc15)}
  .lvl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .lvl-row span{font-weight:800;color:var(--yellow)}
  .upg{background:#7c3aed}
  .upg:disabled{background:#334155;color:#94a3b8;cursor:not-allowed}
  .top[hidden]{display:none}

  /* ---- Vollbild-Layout: alles füllt das Fenster ---- */
  html,body{height:100%;overflow:hidden}
  body{min-height:0}
  main{max-width:none;margin:0;padding:0;gap:0;display:block;height:100vh;height:100dvh}
  #game{border-radius:0;padding:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#0b1020}
  #game[hidden]{display:none}
  .stage{flex:1;min-height:0;display:grid;place-items:center;background:#0b1020}
  .arena-wrap{position:relative;aspect-ratio:8/5;width:min(100vw,calc((100vh - var(--bar,60px)) * 1.6));width:min(100vw,calc((100dvh - var(--bar,60px)) * 1.6))}
  #gl,#arena{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:0}
  #arena{background:transparent}
  #result{border-radius:0}
  #game .bar{margin:0;padding:8px 12px;background:var(--panel);justify-content:center;gap:8px}
  #game .bar .act{padding:9px 14px}
  #game .bar .coins{font-size:15px;padding:6px 12px}
  .home{border-radius:0;height:100vh;height:100dvh}
  .home-tr{display:flex;align-items:center;gap:10px}
  .fs-btn{background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font-weight:900;font-size:18px;padding:6px 12px}
  .fs-btn[hidden]{display:none}
  .home-hero{width:min(64vh,78vw,620px)}
  @media (max-width:640px){ .home{height:100vh;height:100dvh;min-height:640px} #game .bar .who,#game .bar .where{display:none} }

  /* ---- Startbildschirm im Brawl-Stars-Stil ---- */
  .home{position:relative;border-radius:22px;overflow:hidden;color:#fff;isolation:isolate;
    background:
      radial-gradient(ellipse 52% 30% at 50% 84%,rgba(251,191,36,.38),transparent 72%),
      radial-gradient(ellipse 90% 70% at 50% 0%,#7c3aed 0%,#4c1d95 45%,#1e1b4b 100%)}
  .home::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.12;
    background:repeating-linear-gradient(115deg,#fff 0 3px,transparent 3px 52px)}
  .home[hidden]{display:none}
  .stroke{-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
  .home-top{position:absolute;inset:14px 14px auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
  .profile{display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:6px 16px 6px 6px}
  .profile canvas,.profile img{width:52px;height:52px;border-radius:13px;border:3px solid #fff;background:linear-gradient(#38bdf8,#1d4ed8);object-fit:cover}
  .profile b{display:block;font-size:17px;line-height:1.1}
  .profile span{font-weight:800;color:#fde047;font-size:15px}
  .home .coins{background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.25);font-size:20px}
  .home-hero{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);display:grid;justify-items:center;z-index:1;width:min(440px,78vw)}
  #hero{width:100%;height:auto;aspect-ratio:15/14;display:block;cursor:pointer;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4))}
  .nameplate{margin-top:-14px;text-align:center;display:grid;justify-items:center;gap:6px}
  .nameplate h2{margin:0;font-size:clamp(28px,5.4vw,44px)}
  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .badge{background:rgba(0,0,0,.6);padding:3px 12px;border-radius:999px;font-weight:800;font-size:15px;border:2px solid rgba(255,255,255,.25)}
  .up-bs{background:linear-gradient(#4ade80,#16a34a);border:3px solid #052e16;border-radius:14px;color:#fff;font-weight:900;padding:7px 16px;box-shadow:0 3px 0 #052e16;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .up-bs:disabled{background:linear-gradient(#64748b,#475569);border-color:#1e293b;box-shadow:0 3px 0 #1e293b;cursor:not-allowed}
  .home-left{position:absolute;left:14px;bottom:16px;z-index:2}
  .side-btn{position:relative;background:linear-gradient(#60a5fa,#2563eb);border:3px solid #0b1b4d;border-radius:18px;padding:14px 22px;font-size:20px;box-shadow:0 5px 0 #0b1b4d;color:#fff}
  .side-btn:active,.start-bs:active{transform:translateY(3px)}
  .notif{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:#ef4444;border:3px solid #fff;display:none;place-items:center;font-size:14px;font-style:normal;-webkit-text-stroke:0;text-shadow:none}
  .notif.on{display:grid}
  .home-right{position:absolute;right:14px;bottom:16px;display:grid;gap:10px;justify-items:end;z-index:2}
  .mode-card{display:flex;align-items:center;gap:12px;background:rgba(15,23,42,.72);border:3px solid rgba(255,255,255,.3);border-radius:18px;padding:8px 18px 8px 10px;color:#fff;text-align:left}
  .mode-card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:linear-gradient(#f87171,#b91c1c);border:2px solid #fff}
  .mode-card small{display:block;color:#cbd5e1;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .mode-card b{font-size:20px;font-style:italic;text-transform:uppercase}
  .diff-pill{background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;color:#e2e8f0}
  .start-bs{background:linear-gradient(#fde047,#facc15 55%,#eab308);border:4px solid #000;border-radius:20px;color:#fff;font-size:clamp(34px,6.4vw,52px);padding:8px 64px 12px;box-shadow:0 6px 0 #854d0e;
    -webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000;font-style:italic;font-weight:900;letter-spacing:.03em}
  .start-bs:hover{filter:brightness(1.07)}
  @media (max-width:640px){
    .home-hero{bottom:auto;top:148px;width:min(260px,70vw)}
    .home-left{display:flex;left:14px;right:14px;top:84px;bottom:auto;gap:8px}
    .side-btn{padding:10px 8px;font-size:14px;flex:1;text-align:center}
    .home-right{left:14px;right:14px;justify-items:stretch}
    .start-bs{width:100%;padding-inline:0}
    .mode-card{justify-content:flex-start}
    .diff-pill{justify-self:center}
  }
</style>
</head>
<body>
<main>
  <section class="home" id="lobby" aria-label="Startbildschirm">
    <div class="home-top">
      <div class="profile">
        <img id="avatar" width="64" height="64" alt="">
        <div><b>Spieler</b><span>🏆 <span id="trophies">0</span></span></div>
      </div>
      <div class="home-tr"><span class="coins">🪙 <span class="coin-n">0</span></span><button class="fs-btn fs-home" title="Vollbild (F)">⛶</button></div>
    </div>

    <div class="home-hero">
      <canvas id="hero" width="600" height="560" aria-label="Dein Brawler – tippen für Brawler-Auswahl"></canvas>
      <div class="nameplate">
        <h2 class="stroke" id="hero-name">Shelly</h2>
        <div class="badges"><span class="badge" id="hero-lvl">⚡ Power 1</span><span class="badge" id="hero-trophy">🏆 0</span></div>
        <button class="up-bs" id="upgrade-btn"></button>
      </div>
    </div>

    <div class="home-left">
      <button class="side-btn stroke" id="brawler-btn">Brawler<i class="notif" id="notif">!</i></button>
      <button class="side-btn stroke gold" id="pass-btn">Brawl Pass<i class="notif" id="notif-pass">!</i></button>
      <button class="side-btn stroke green" id="quest-btn">Quests<i class="notif" id="notif-quest">!</i></button>
    </div>

    <div class="home-right">
      <button class="mode-card" id="mode-btn" title="Modus wechseln"><span class="ico">☠</span><span><small>Showdown</small><b id="mode-name">Solo</b></span></button>
      <button class="diff-pill" id="diff-btn" title="Schwierigkeit der Bots wechseln">Bots: Normal</button>
      <button class="start-bs" id="start-btn">Start</button>
    </div>
  </section>

  <section class="panel" id="game" hidden>
    <div class="stage">
      <div class="arena-wrap">
        <canvas id="gl" aria-hidden="true"></canvas>
        <canvas id="arena" width="800" height="500" aria-label="Arena"></canvas>
        <div id="result" hidden></div>
      </div>
    </div>
    <div class="bar" id="gamebar">
      <span class="who" id="who">Shelly</span>
      <span class="where" id="where"></span>
      <button class="act" id="atk">Angriff</button>
      <button class="act" id="sup">Super</button>
      <span class="coins">🪙 <span class="coin-n">0</span></span>
      <button class="act" id="open-menu" style="background:#7c3aed">☰ Brawler</button>
      <button class="act fs-btn" style="background:#334155" title="Vollbild (F)">⛶</button>
      <button class="act" id="home" style="background:#475569">⌂ Hauptmenü</button>
    </div>
  </section>
</main>

<div id="toast" hidden></div>

<div id="menu" hidden role="dialog" aria-modal="true" aria-label="Brawler-Menü">
  <div class="menu-in">
    <div class="menu-head">
      <h2 id="menu-title">Brawler</h2>
      <span class="coins">🪙 <span class="coin-n">0</span></span>
      <button class="close" id="close-menu">✕ Schließen</button>
    </div>
    <div id="chips" class="chips"></div>
    <div id="rarities" class="rarity"></div>
    <p class="note" id="menu-note">Brawler antippen zum Wählen, gesperrte mit Münzen freischalten. Werte sind nur ungefähr und dienen dem Training in der Arena.</p>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(() => {
  /* ---------- Daten ---------- */
  const RARITIES = [
    { id: 'start',  name: 'Start',  color: '#94a3b8', info: 'Jeder Spieler beginnt mit diesem Brawler' },
    { id: 'selten', name: 'Selten', color: '#22c55e', info: '8 Brawler' },
    { id: 'super', name: 'Super Selten', color: '#38bdf8', info: '8 Brawler' },
    { id: 'episch', name: 'Episch', color: '#a855f7', info: '20 Brawler' },
    { id: 'mythisch', name: 'Mythisch', color: '#ef4444', info: '10 Brawler' },
    { id: 'legendaer', name: 'Legendär', color: '#facc15', info: '8 Brawler' },
  ];

  const BRAWLERS = [
    { id:'shelly', rarity:'start', name:'Shelly', role:'Schadensausteiler', hp:3600, speed:190, size:1,
      look:{ skin:'#e8b48a', hair:'#a855f7', body:'#7e22ce', accent:'#facc15', weapon:'gun', wc:'#334155', len:24 },

    }
    if (f.dash) {
      const d = f.dash; d.t -= dt; f.x += d.vx * dt; f.y += d.vy * dt;
      for (const t of foes(f)) if (!d.hit.has(t) && Math.hypot(t.x - f.x, t.y - f.y) < f.r + t.r) {
        d.hit.add(t); hit(t, d.dmg, d.src, f); t.x += d.vx * .06; t.y += d.vy * .06; pop(t.x, t.y, '#fde047', 8);
      }
      if (d.t <= 0) f.dash = null;
    } else {
      const len = Math.hypot(dx, dy), sp = f.B.speed * (f.shield > 0 ? 1.4 : 1) * (f.buff ? f.buff.speed : 1) * (f.invis > 0 ? 1.2 : 1) * (f.team === P.team ? 1 : DIFF.speed);
      if (len) { f.vx = dx / len * sp; f.vy = dy / len * sp; f.x += f.vx * dt; f.y += f.vy * dt; }
    }
    pushOut(f, f.r);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (screen === 'game') { update(dt); draw(now); } else drawHero(now);
    requestAnimationFrame(frame);
  }

  function update(dt) {
    if (menuOpen || screen !== 'game') return;
    updateCamera(dt);
    pointer = screenToWorld(ptrScr.x, ptrScr.y);
    moveTo = moveScr ? screenToWorld(moveScr.x, moveScr.y) : null;
    if (!matchOver) {
      for (const f of fighters) {
        if (!f.alive) { if (f.out) continue; f.dead += dt; if (f.dead >= RESPAWN) respawn(f); continue; }
        f.ammo = Math.min(3, f.ammo + dt / 1.3);
        f.recoil = Math.max(0, f.recoil - dt * 60);
        f.shield = Math.max(0, f.shield - dt);
        f.invis = Math.max(0, f.invis - dt);
        if (f.buff && (f.buff.t -= dt) <= 0) f.buff = null;
        f.flash = Math.max(0, f.flash - dt);
        let dx = 0, dy = 0;
        if (f.isPlayer) {
          dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
          dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
          if (moveTo) { const tx = moveTo.x - f.x, ty = moveTo.y - f.y, d = Math.hypot(tx, ty); if (d > 12) { dx = tx / d; dy = ty / d; } }
          f.ptr = pointer;
        } else { const r = think(f, dt); dx = r.dx; dy = r.dy; }
        step(f, dt, dx, dy);
        if (f.isPlayer) f.aim = Math.atan2(pointer.y - f.y, pointer.x - f.x);
      }
      matchT += dt;
      if (matchT > GAS_START) {
        gasTick -= dt;
        if (gasTick <= 0) {
          gasTick = .5;
          const dmg = (300 + 600 * gasProgress()) * .5;
          for (const f of fighters) if (f.alive && outZone(f.x, f.y)) {
            f.hp -= dmg; f.flash = .12;
            floaters.push({ x: f.x + rnd(-10, 10), y: f.y - 24, t: .6, txt: Math.round(dmg), gas: true });
            if (f.hp <= 0) kill(f, null);
          }
        }
      }
    }

    // Geschosse
    for (const p of shots) {
      if (p.boom) {
        p.t += dt; const half = p.dur / 2, fx_ = p.sx + Math.cos(p.ang) * p.range, fy_ = p.sy + Math.sin(p.ang) * p.range;
        if (p.t < half) { const k = p.t / half; p.x = p.sx + (fx_ - p.sx) * k; p.y = p.sy + (fy_ - p.sy) * k; }
        else {
          if (!p.turned) { p.turned = true; p.hit.clear(); }
          const k = Math.min(1, (p.t - half) / half); p.x = fx_ + (p.o.x - fx_) * k; p.y = fy_ + (p.o.y - fy_) * k;
        }
        if (p.t >= p.dur) p.life = 0;
      } else {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.bounces > 0) {
          if (p.x < 0 || p.x > W) { p.vx = -p.vx; p.x = clamp(p.x, 0, W); p.bounces--; }
          if (p.y < 0 || p.y > H) { p.vy = -p.vy; p.y = clamp(p.y, 0, H); p.bounces--; }
        }
        const w = wallHit(p.x, p.y, p.r * .5);
        if (w) {
          if (p.bounces > 0) {
            const px = p.x - p.vx * dt, py = p.y - p.vy * dt;
            if (px > w.x - 1 && px < w.x + w.w + 1) p.vy = -p.vy; else p.vx = -p.vx;
            p.x = px; p.y = py; p.bounces--;
          } else { p.life = 0; if (!p.aoe) continue; }
        }
      }
      for (const f of foes(p.o)) {
        if (p.hit.has(f) || Math.hypot(p.x - f.x, p.y - f.y) >= f.r + p.r) continue;
        if (p.aoe) { p.life = 0; break; }
        hit(f, p.dmg, p.src, p.o); pop(p.x, p.y, '#fde047', 3);
        if (p.knock) { f.x += p.vx * p.knock; f.y += p.vy * p.knock; pushOut(f, f.r); }
        if (p.pierce) p.hit.add(f); else { p.life = 0; break; }
      }
      if (p.life <= 0 && p.aoe) explode(p.x, p.y, p.aoe, p.dmg, p.src, p.o);
    }
    shots = shots.filter(p => p.life > 0 && p.x > -30 && p.x < W + 30 && p.y > -30 && p.y < H + 30);

    // Flaschen & Pfützen
    for (const l of lobs) {
      l.t += dt;
      if (l.t >= l.dur) {
        const pd = l.a.puddle; explode(l.tx, l.ty, pd ? pd.r : l.a.splash, l.a.dmg, l.src, l.o);
        if (pd) puddles.push({ o: l.o, x: l.tx, y: l.ty, r: pd.r, t: pd.time, max: pd.time, tick: 0, dmg: pd.tick, src: l.src, color: pd.color });
        l.done = true;
      }
    }
    lobs = lobs.filter(l => !l.done);
    for (const p of puddles) {
      p.t -= dt; p.tick -= dt;
      if (p.tick <= 0) { p.tick = .25; for (const f of foes(p.o)) if (Math.hypot(f.x - p.x, f.y - p.y) < p.r + f.r) hit(f, p.dmg, p.src, p.o); }
    }
    puddles = puddles.filter(p => p.t > 0);

    // Zeitgesteuerte Effekte (Raketenregen, Wirbel)
    for (const t of timers) { t.t -= dt; if (t.t <= 0) { t.fn(); t.done = true; } }
    timers = timers.filter(t => !t.done);

    // Bär
    for (const b of bears) {
      b.t -= dt; b.cd -= dt;
      let tg = null, best = 1e9;
      for (const f of foes(b.o)) { const m = Math.hypot(f.x - b.x, f.y - b.y); if (m < best) { best = m; tg = f; } }
      if (tg) {
        b.face = Math.atan2(tg.y - b.y, tg.x - b.x);
        if (best > 34 + tg.r) { b.x += (tg.x - b.x) / best * 170 * dt; b.y += (tg.y - b.y) / best * 170 * dt; pushOut(b, 17); }
        else if (b.cd <= 0) { b.cd = .5; hit(tg, 400, 'sup', b.o); pop(tg.x, tg.y, '#fde047', 6); }
      }
    }
    bears = bears.filter(b => b.t > 0);

    // Geschütztürme
    for (const t of turrets) {
      t.t -= dt; t.cd -= dt;
      let tg = null, best = 380;
      for (const f of foes(t.o)) { const m = Math.hypot(f.x - t.x, f.y - t.y); if (m < best) { best = m; tg = f; } }
      if (tg) {
        t.ang = Math.atan2(tg.y - t.y, tg.x - t.x);
        if (t.cd <= 0) {
          t.cd = t.a.every;
          shots.push({ o: t.o, x: t.x + Math.cos(t.ang) * 20, y: t.y + Math.sin(t.ang) * 20, vx: Math.cos(t.ang) * 800, vy: Math.sin(t.ang) * 800,
            life: .5, dmg: t.a.dmg, r: 5, pierce: false, hit: new Set(), src: 'sup', knock: 0, bounces: 0, color: '#fde047' });
        }
      }
    }
    turrets = turrets.filter(t => t.t > 0);

    for (const f of fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; }
    fx = fx.filter(f => f.life > 0);
    for (const f of floaters) { f.age = (f.age || 0) + dt; f.t -= dt; }
    floaters = floaters.filter(f => f.t > 0);
    for (const r of rings) r.t -= dt;
    rings = rings.filter(r => r.t > 0);

    supBtn.classList.toggle('ready', P.charge >= 1);
    supBtn.textContent = P.charge >= 1 ? P.B.supName.toUpperCase() + '!' : 'Super ' + Math.floor(P.charge * 100) + '%';
    atkBtn.textContent = 'Angriff ' + '●'.repeat(Math.floor(P.ammo)) + '○'.repeat(3 - Math.floor(P.ammo));
  }

  /* ----- Zeichnen ----- */
  // Lebensbalken wie im Original: Zahl im Balken, Power-Abzeichen links, Grün = Team, Rot = Gegner
  const jumpZ = f => f.jump ? Math.sin(Math.PI * Math.min(1, f.jump.t / f.jump.dur)) * 80 : 0;
  function drawBars(f) {
    const sz = f.B.size, w = 64, h = 15, a = proj(f.x, 76 * sz + jumpZ(f), f.y), x0 = a.x - w / 2, y0 = a.y - h;
    const ally = f.team === P.team, pct = Math.max(0, f.hp / f.max);
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = '800 11px system-ui,sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
    const label = ((f.isPlayer ? 'DU · ' : ally ? 'TEAM · ' : '') + f.name).toUpperCase();
    ctx.strokeText(label, a.x, y0 - 5); ctx.fillText(label, a.x, y0 - 5);
    rr(ctx, x0, y0, w, h, 7.5); ctx.fillStyle = '#0b1020'; ctx.fill();
    ctx.save(); rr(ctx, x0 + 1.6, y0 + 1.6, w - 3.2, h - 3.2, 6); ctx.clip();
    const col = ally ? ['#a7f3d0', '#16a34a'] : ['#fecaca', '#dc2626'];
    const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g; ctx.fillRect(x0 + 1.6, y0 + 1.6, (w - 3.2) * pct, h - 3.2);
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    for (let k = 1000; k < f.max; k += 1000) ctx.fillRect(x0 + 1.6 + (w - 3.2) * k / f.max - .5, y0 + 1.6, 1, h - 3.2);
    ctx.restore();
    ctx.lineWidth = 2.2; ctx.strokeStyle = '#000'; rr(ctx, x0, y0, w, h, 7.5); ctx.stroke();
    ctx.font = '900 11px system-ui,sans-serif'; ctx.lineWidth = 2.6; ctx.fillStyle = '#fff';
    ctx.strokeText(Math.max(0, Math.ceil(f.hp)), a.x + 5, y0 + 11.3); ctx.fillText(Math.max(0, Math.ceil(f.hp)), a.x + 5, y0 + 11.3);
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(x0 - 1, y0 + h / 2, 9.5, 0, TAU); ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = '#000'; ctx.stroke();
    ctx.fillStyle = '#422006'; ctx.font = '900 11px system-ui,sans-serif'; ctx.fillText(f.level, x0 - 1, y0 + h / 2 + 4);
  }
  // Munition (3 Segmente) und Super-Ladung unter deinem Brawler
  function drawAmmo(f) {
    const a = proj(f.x, 0, f.y + 24 * f.B.size), segW = 16, gap = 3, tot = 3 * segW + 2 * gap, x0 = a.x - tot / 2, y = a.y + 8;
    for (let k = 0; k < 3; k++) {
      const x = x0 + k * (segW + gap), fill = clamp(f.ammo - k, 0, 1);
      rr(ctx, x, y, segW, 7, 3.5); ctx.fillStyle = '#0b1020'; ctx.fill();
      if (fill > 0) { ctx.save(); rr(ctx, x, y, segW, 7, 3.5); ctx.clip(); ctx.fillStyle = fill >= 1 ? '#fb923c' : '#fdba74'; ctx.fillRect(x, y, segW * fill, 7); ctx.restore(); }
      ctx.lineWidth = 1.8; ctx.strokeStyle = '#000'; rr(ctx, x, y, segW, 7, 3.5); ctx.stroke();
    }
    rr(ctx, x0, y + 10, tot, 5, 2.5); ctx.fillStyle = '#0b1020'; ctx.fill();
    if (f.charge > 0) { ctx.save(); rr(ctx, x0, y + 10, tot, 5, 2.5); ctx.clip(); ctx.fillStyle = f.charge >= 1 ? '#fde047' : '#facc15'; ctx.fillRect(x0, y + 10, tot * f.charge, 5); ctx.restore(); }
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#000'; rr(ctx, x0, y + 10, tot, 5, 2.5); ctx.stroke();
  }
  // Große Lebensanzeige unten links
  function drawHpHud() {
    const x = 10, y = H - 44, w = 210, h = 32, hp = Math.max(0, Math.ceil(P.hp)), pct = Math.max(0, P.hp / P.max);
    rr(ctx, x, y, w, h, 16); ctx.fillStyle = 'rgba(15,23,42,.85)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
    ctx.font = '900 20px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#f87171'; ctx.fillText('♥', x + 10, y + 23);
    const bx = x + 36, bw = w - 46;
    rr(ctx, bx, y + 8, bw, 16, 8); ctx.fillStyle = '#0b1020'; ctx.fill();
    ctx.save(); rr(ctx, bx + 1.5, y + 9.5, bw - 3, 13, 6.5); ctx.clip();
    const g = ctx.createLinearGradient(0, y + 8, 0, y + 24); g.addColorStop(0, pct > .3 ? '#a7f3d0' : '#fecaca'); g.addColorStop(1, pct > .3 ? '#16a34a' : '#dc2626');
    ctx.fillStyle = g; ctx.fillRect(bx + 1.5, y + 9.5, (bw - 3) * pct, 13); ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = '#000'; rr(ctx, bx, y + 8, bw, 16, 8); ctx.stroke();
    ctx.font = '900 12px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.fillStyle = '#fff';
    const txt = hp + ' / ' + P.max; ctx.strokeText(txt, bx + bw / 2, y + 20.6); ctx.fillText(txt, bx + bw / 2, y + 20.6);
    ctx.textAlign = 'center';
  }
  function drawGasInfo() {
    let txt = '', hot = false;
    if (matchT < GAS_START) { const s = Math.ceil(GAS_START - matchT); txt = '☠ Giftwolke in ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); hot = s <= 10; }
    else if (gasProgress() < 1) { txt = '☠ Giftwolke zieht zu – ab in die Mitte!'; hot = true; }
    else { txt = '☠ Giftwolke am Ziel'; hot = true; }
    ctx.font = '800 13px system-ui,sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(txt).width + 28, x = W / 2 - w / 2, y = H - 34;
    const pulse = hot ? .75 + .25 * Math.sin(performance.now() / 160) : .75;
    ctx.fillStyle = 'rgba(15,23,42,' + pulse + ')'; rr(ctx, x, y, w, 24, 12); ctx.fill();
    ctx.fillStyle = hot ? '#86efac' : '#e2e8f0'; ctx.fillText(txt, W / 2, y + 16);
  }
  function drawScore() {
    ctx.font = '800 12px system-ui,sans-serif';
    fighters.forEach((f, i) => {
      const x = duoMatch ? 8 + f.team * 262 : 8 + i * 196, y = duoMatch ? 8 + f.slot * 27 : 8, w = duoMatch ? 254 : 188;
      ctx.globalAlpha = f.out ? .45 : 1;
      ctx.fillStyle = 'rgba(15,23,42,.78)'; rr(ctx, x, y, w, 24, 12); ctx.fill();
      ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(x + 13, y + 12, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText((f.isPlayer ? 'Du' : f.name).slice(0, duoMatch ? 14 : 10), x + 26, y + 16);
      const hx = x + w - 80;
      if (f.out) { ctx.fillStyle = '#fca5a5'; ctx.fillText('RAUS', hx, y + 16); }
      else for (let k = 0; k < LIVES; k++) { ctx.fillStyle = k < f.lives ? '#f87171' : '#475569'; ctx.fillText('♥', hx + k * 13, y + 16); }
      ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.fillText('⚔' + f.kills, x + w - 8, y + 16);
      ctx.globalAlpha = 1;
    });
    ctx.textAlign = 'center';
  }

  // Zeichenauflösung wächst mit der Anzeigegröße (Vollbild bleibt scharf); alle Koordinaten bleiben 800 x 500
  let resK = 1;
  function syncRes() {
    const r = cv.getBoundingClientRect();
    const k = Math.min(2.5, Math.max(1, Math.round(r.width * (window.devicePixelRatio || 1) / W * 2) / 2));
    if (k !== resK) { resK = k; cv.width = W * k; cv.height = H * k; }
    return k;
  }

  function draw(now) {
    const K = syncRes();
    ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, W, H);
    if (GL_OK) render3D(now || performance.now());
    for (const f of fighters) if (f.alive && f !== P && !fighterHidden(f)) drawBars(f);
    if (P.alive) { drawBars(P); drawAmmo(P); }
    ctx.font = '800 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3;
    for (const f of floaters) {
      const a = proj(f.x, 66 + 40 * (f.age || 0), f.y);
      ctx.strokeStyle = '#000'; ctx.strokeText(f.txt, a.x, a.y);
      ctx.fillStyle = f.red ? '#fca5a5' : typeof f.txt === 'string' || f.gas ? '#86efac' : f.bad ? '#fca5a5' : '#fde047'; ctx.fillText(f.txt, a.x, a.y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ptrScr.x, ptrScr.y, 8, 0, TAU); ctx.moveTo(ptrScr.x - 13, ptrScr.y); ctx.lineTo(ptrScr.x + 13, ptrScr.y);
    ctx.moveTo(ptrScr.x, ptrScr.y - 13); ctx.lineTo(ptrScr.x, ptrScr.y + 13); ctx.stroke();

    drawScore(); drawGasInfo(); drawHpHud();
    if (P.out && !matchOver) { // Duo: du bist raus, der Teamkamerad kämpft weiter
      ctx.font = '800 14px system-ui,sans-serif'; ctx.textAlign = 'center';
      const txt = 'Du bist raus – dein Teamkamerad kämpft weiter!', tw = ctx.measureText(txt).width + 28;
      ctx.fillStyle = 'rgba(15,23,42,.8)'; rr(ctx, W / 2 - tw / 2, 74, tw, 28, 14); ctx.fill();
      ctx.fillStyle = '#fca5a5'; ctx.fillText(txt, W / 2, 93);
    } else if (!P.alive && !matchOver) {
      ctx.fillStyle = 'rgba(15,23,42,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.font = '800 34px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Besiegt!', W / 2, H / 2 - 6);
      ctx.font = '700 18px system-ui,sans-serif';
      ctx.fillText('Noch ' + P.lives + (P.lives === 1 ? ' Leben – letzte Chance!' : ' Leben') + ' · Neuer Versuch in ' + Math.ceil(RESPAWN - P.dead) + ' …', W / 2, H / 2 + 24);
    }
  }

  showCoins();
  renderLobby();
  requestAnimationFrame(frame);
})();
</script>
</body>
