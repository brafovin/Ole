  :root[data-theme="dark"]{

  .facts{display:flex;gap:6px 26px;flex-wrap:wrap}

  .facts dd{margin:0;font-family:var(--mono);font-size:17px}

      'onesize': 'One size', 'unit': 'pcs', 'standard': 'Standard', 'stock.row': 'Stock',
      's.pcs': 'Pieces in stock', 's.pcs.sub': '{v} variants, {p} products', 's.out': 'Empty', 's.out.sub': 'variants out of stock', 's.out.none': 'nothing empty',
      's.low': 'Low', 's.low.sub': 'below minimum stock', 's.inc': 'On the way', 's.inc.sub': n => `${n} open deliver${n === 1 ? 'y' : 'ies'}`, 's.next': 'Next delivery', 's.next.none': 'none open',
      'eta.back': 'Back in stock from <b>{d}</b> ({r})', 'eta.restock': 'Restock <b>{d}</b> ({r})', 'eta.need': (n, l) => `${n} variant${n === 1 ? '' : 's'} without a delivery · usual delivery time <b>${days(l)}</b>`, 'eta.normal': 'Usual delivery time <b>{l}</b>',
      'p.out': '{n} empty', 'p.low': '{n} low', 'p.inc': '{n} on the way', 'p.ok': 'Stock OK',
      'f.min': 'Minimum stock', 'f.lead': 'Usual delivery time', 'f.next': 'Next delivery',
      'l.ok': 'OK', 'l.low': 'low (up to {m})', 'l.out': 'empty', 'l.inc': '+number = on the way, with arrival date', 'l.off': 'struck through = sold out in the shop', 'cell.off': 'Marked as sold out in the shop',
      'list.empty': 'Nothing in stock matches. Try another term or remove a filter.',
      'o.title': 'On the way ({n})', 'o.empty': 'Nothing is on the way right now.', 'o.ordered': 'ordered {d}', 'o.total': 'Total delivery time <b>{d}</b>', 'o.left': '<b>{d}</b> left', 'o.today': '<b>arrives today</b>', 'o.late': '<b>{d} overdue</b>', 'o.prog': '{p} percent of the delivery time has passed',
      'rel.today': 'today', 'rel.tomorrow': 'tomorrow', 'rel.in': n => `in ${n} days`, 'rel.late1': 'overdue since yesterday', 'rel.late': n => `overdue for ${n} days`,
    },
  };
  let LANG = 'de';
  function days(n) { return LANG === 'en' ? `${n} day${n === 1 ? '' : 's'}` : `${n} Tag${n === 1 ? '' : 'e'}`; }
  const t = (k, v, w) => { let x = I18N[LANG][k]; if (x === undefined) x = I18N.de[k]; if (x === undefined) return k; if (typeof x === 'function') return x(v, w); return v ? x.replace(/\{(\w+)\}/g, (m, n) => (v[n] !== undefined ? v[n] : m)) : x; };
  const pname = p => (LANG === 'en' && PN_EN[p.id]) || p.name;
  const colorName = c => (c ? t('col.' + c) : '');
  const SW = { white: '#f4f2ee', black: '#161616', grey: '#8d8d8f', darkgrey: '#48484a', silver: '#c4c7cc' };
  const LEAD0 = { tshirt: 14, jacken: 21, hose: 18, zubehoer: 10, haarpflege: 7, schuhe: 25, parfum: 12 };
  const KEY = 'rare-form-lager-theme';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sizeLabel = s => (s === 'Einheitsgröße' ? t('onesize') : s === '' ? t('unit') : s);
  const vkey = (p, c, s) => `${p.id}|${c}|${s}`;
  const variants = p => p.colors.flatMap(c => p.sizes.map(s => ({ key: vkey(p, c, s), c, s, offered: p.offered.includes(s) })));
  const byId = id => P.find(p => p.id === id);
  const vname = (p, v) => [colorName(v.c), v.s && sizeLabel(v.s)].filter(Boolean).join(' · ') || t('standard');

  /* ---------- Datum ---------- */
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = day0(d); x.setDate(x.getDate() + n); return x; };
  const diffDays = d => Math.round((day0(d) - day0(new Date())) / 864e5);
  const fmt = d => new Date(d).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
  const rel = d => { const n = diffDays(d); return n === 0 ? t('rel.today') : n === 1 ? t('rel.tomorrow') : n > 1 ? t('rel.in', n) : n === -1 ? t('rel.late1') : t('rel.late', -n); };

  /* ---------- Beispieldaten ---------- */
  function rng(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
  function seed() {
    const st = { stock: {}, min: {}, lead: {}, orders: [] };
    P.forEach((p, pi) => {
      st.min[p.id] = p.sizes.length === 1 && p.colors.length === 1 ? 10 : 5;
      st.lead[p.id] = LEAD0[p.type] + (pi % 3) * 2;
      variants(p).forEach(v => {
        const r = rng(v.key)(); const q = !v.offered ? 0 : r < .1 ? 0 : r < .3 ? 1 + Math.floor(rng(v.key + 'a')() * 5) : 8 + Math.floor(rng(v.key + 'b')() * 40);
        st.stock[v.key] = q;
      });
    });
    const mk = (pid, ago, lead, n) => {
      const p = byId(pid), low = variants(p).filter(v => v.offered && st.stock[v.key] <= st.min[pid]).slice(0, n);
      if (!low.length) return;
      st.orders.push({ id: 'B-' + (2041 + st.orders.length), pid, created: addDays(new Date(), -ago).toISOString(), eta: addDays(new Date(), lead).toISOString(), lines: low.map(v => ({ key: v.key, qty: 24 })) });
    };
    mk('rf13', 6, 15, 3); mk('rf1', 11, 3, 3); mk('rf12', 18, 7, 2); mk('rf10', 3, 15, 2);
    return st;
  }
  const S = seed();

  /* ---------- Berechnungen ---------- */
  const qty = k => S.stock[k] || 0;
  const status = (q, min) => (q === 0 ? 'out' : q <= min ? 'low' : 'ok');
  const incoming = k => S.orders.reduce((n, o) => n + o.lines.reduce((m, l) => m + (l.key === k ? l.qty : 0), 0), 0);
  const nextEta = k => { const e = S.orders.filter(o => o.lines.some(l => l.key === k)).map(o => new Date(o.eta)).sort((a, b) => a - b)[0]; return e || null; };
  function prodInfo(p) {
    const vs = variants(p), min = S.min[p.id];
    const info = vs.map(v => ({ ...v, q: qty(v.key), st: status(qty(v.key), min), inc: incoming(v.key), eta: nextEta(v.key) }));
    const total = info.reduce((n, v) => n + v.q, 0);
    const out = info.filter(v => v.st === 'out'), low = info.filter(v => v.st === 'low');
    const open = S.orders.filter(o => o.pid === p.id);
    const need = out.concat(low).filter(v => !v.inc);                       // knapp oder leer und noch nichts bestellt
    const back = out.filter(v => v.eta).map(v => v.eta).sort((a, b) => a - b)[0];
    return { info, total, out, low, open, need, back, min, lead: S.lead[p.id] };
  }

  /* ---------- Ansicht ---------- */
  let tab = 'stock', filter = 'alle', cat = 'alle', sortBy = 'urg', term = '';
  const openSet = new Set();
  const fold = x => String(x).toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '');

  const pcs = n => `${n} ${t('unit')}`;
  function renderStats() {
    const all = P.map(prodInfo); const vs = all.flatMap(a => a.info);
    const tot = vs.reduce((n, v) => n + v.q, 0), out = vs.filter(v => v.st === 'out').length, low = vs.filter(v => v.st === 'low').length;
    const onway = S.orders.reduce((n, o) => n + o.lines.reduce((m, l) => m + l.qty, 0), 0);
    const nx = S.orders.map(o => new Date(o.eta)).sort((a, b) => a - b)[0];
    $('stats').innerHTML = `
      <div class="stat"><b>${tot}</b><span>${t('s.pcs')}</span><small>${t('s.pcs.sub', { v: vs.length, p: P.length })}</small></div>
      <div class="stat out"><b>${out}</b><span>${t('s.out')}</span><small>${out ? t('s.out.sub') : t('s.out.none')}</small></div>
      <div class="stat low"><b>${low}</b><span>${t('s.low')}</span><small>${t('s.low.sub')}</small></div>
      <div class="stat inc"><b>${onway}</b><span>${t('s.inc')}</span><small>${t('s.inc.sub', S.orders.length)}</small></div>
      <div class="stat"><b style="font-size:20px;padding-top:5px">${nx ? fmt(nx) : '–'}</b><span>${t('s.next')}</span><small>${nx ? rel(nx) : t('s.next.none')}</small></div>`;
    $('ordn').textContent = S.orders.length;
  }

  function etaLine(a) {
    if (a.out.length || a.low.length) {
      const parts = [];
      if (a.back) parts.push(t(a.out.length ? 'eta.back' : 'eta.restock', { d: fmt(a.back), r: rel(a.back) }));
      if (a.need.length) parts.push(t('eta.need', a.need.length, a.lead));
      return parts.length ? `<span class="eta">${parts.join(' · ')}</span>` : '';
    }
    return `<span class="eta">${t('eta.normal', { l: days(a.lead) })}</span>`;
  }

  function matrix(p, a) {
    const head = `<tr><th class="rowh"></th>${p.sizes.map(s => `<th>${esc(sizeLabel(s))}</th>`).join('')}</tr>`;
    const rows = p.colors.map(c => `<tr><th class="rowh" scope="row">${c ? `<i class="sw" style="background:${SW[c]}"></i>${colorName(c)}` : t('stock.row')}</th>${p.sizes.map(s => {
      const v = a.info.find(x => x.c === c && x.s === s);
      return `<td><div class="cell ${v.st}${v.offered ? '' : ' off'}" ${v.offered ? '' : `title="${esc(t('cell.off'))}"`} aria-label="${esc(pname(p))} ${esc(vname(p, v))}: ${pcs(v.q)}">${v.q}</div>
        <span class="more">${v.inc ? `+${v.inc} · ${fmt(v.eta).replace(/^\S+\s/, '')}` : ''}</span></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="matrix-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }

  function prodCard(p) {
    const a = prodInfo(p), open = openSet.has(p.id);
    const pill = a.out.length ? `<span class="pill out">${t('p.out', { n: a.out.length })}</span>` : '';
    const pill2 = a.low.length ? `<span class="pill low">${t('p.low', { n: a.low.length })}</span>` : '';
    const pill3 = a.open.length ? `<span class="pill inc">${t('p.inc', { n: a.open.reduce((n, o) => n + o.lines.reduce((m, l) => m + l.qty, 0), 0) })}</span>` : '';
    const pillOk = !a.out.length && !a.low.length ? `<span class="pill ok">${t('p.ok')}</span>` : '';
    const thumb = p.thumbs[p.colors[0]] || Object.values(p.thumbs)[0];
    const nextD = a.open.length ? fmt(a.open.map(o => new Date(o.eta)).sort((x, y) => x - y)[0]) : '';
    return `<article class="prod" data-p="${p.id}">
      <button class="head" type="button" data-toggle="${p.id}" aria-expanded="${open}">
        <img class="thumb" src="${thumb}" alt="" loading="lazy">
        <div class="pn"><h3>${esc(pname(p))}</h3>
          <div class="sub"><span>${t('type.' + p.type)}</span>${pill}${pill2}${pill3}${pillOk}</div>
          <div class="strip" aria-hidden="true">${a.info.map(v => `<i class="${v.st}${v.inc ? ' inc' : ''}"></i>`).join('')}</div>

        <div class="tot"><b>${a.total}</b><span>${t('unit')}</span><svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg></div>
      </button>
      ${open ? `<div class="body">
        <dl class="facts"><div><dt>${t('f.min')}</dt><dd>${pcs(a.min)}</dd></div><div><dt>${t('f.lead')}</dt><dd>${days(a.lead)}</dd></div>${nextD ? `<div><dt>${t('f.next')}</dt><dd>${nextD}</dd></div>` : ''}</dl>
        ${matrix(p, a)}
        <div class="legend"><span><i style="background:var(--ok)"></i>${t('l.ok')}</span><span><i style="background:var(--low)"></i>${t('l.low', { m: a.min })}</span><span><i style="background:var(--out)"></i>${t('l.out')}</span><span style="color:var(--inc)">${t('l.inc')}</span>${p.sizes.some(s => !p.offered.includes(s)) ? `<span>${t('l.off')}</span>` : ''}</div>
      </div>` : ''}
    </article>`;
  }

  function renderList() {
    const toks = fold(term).split(/\s+/).filter(Boolean);
    let items = P.map(p => ({ p, a: prodInfo(p) })).filter(({ p, a }) => {
      if (cat !== 'alle' && p.type !== cat) return false;
      if (filter === 'leer' && !a.out.length) return false;
      if (filter === 'knapp' && !a.low.length && !a.out.length) return false;
      if (filter === 'unterwegs' && !a.open.length) return false;
      const hay = fold([p.name, PN_EN[p.id] || '', t('type.' + p.type), I18N.de['type.' + p.type], ...p.colors.map(c => colorName(c) + ' ' + (c ? I18N.de['col.' + c] + ' ' + I18N.en['col.' + c] : '')), ...p.sizes].join(' '));
      return toks.every(w => hay.includes(w));
    });
    const urg = x => x.a.out.length * 100 + x.a.low.length;
    items.sort(sortBy === 'name' ? (x, y) => pname(x.p).localeCompare(pname(y.p), LANG) : sortBy === 'low' ? (x, y) => x.a.total - y.a.total : sortBy === 'high' ? (x, y) => y.a.total - x.a.total : (x, y) => urg(y) - urg(x) || x.a.total - y.a.total);
    $('list').innerHTML = items.length ? items.map(({ p }) => prodCard(p)).join('') : `<div class="empty">${t('list.empty')}</div>`;
  }

  function renderChips() {
    const cnt = { alle: P.length, leer: 0, knapp: 0, unterwegs: 0 };
    P.forEach(p => { const a = prodInfo(p); if (a.out.length) cnt.leer++; if (a.low.length || a.out.length) cnt.knapp++; if (a.open.length) cnt.unterwegs++; });
    $('chips').innerHTML = Object.keys(cnt).map(k => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${t('f.' + k)} · ${cnt[k]}</button>`).join('');
  }

  function renderOrders() {
    const open = [...S.orders].sort((a, b) => new Date(a.eta) - new Date(b.eta));
    const card = o => {
      const p = byId(o.pid), n = o.lines.reduce((m, l) => m + l.qty, 0), late = diffDays(o.eta) < 0;
      const span = Math.max(1, diffDays(o.eta) - diffDays(o.created)), done = Math.max(0, Math.min(1, (0 - diffDays(o.created)) / span));
      const left = diffDays(o.eta), pct = Math.round(done * 100);
      return `<article class="ord${late ? ' late' : ''}" data-o="${o.id}">
        <div><div class="no">${o.id} · ${t('o.ordered', { d: fmt(o.created) })}</div><h3>${esc(pname(p))}</h3>
          <ul>${o.lines.map(l => { const v = variants(p).find(x => x.key === l.key); return `<li>${esc(vname(p, v))} <b>×${l.qty}</b></li>`; }).join('')}</ul></div>
        <div class="when"><b>${fmt(o.eta)}</b><span>${rel(o.eta)}</span><span class="num">${pcs(n)}</span></div>
        <div class="prog"><div class="track" role="img" aria-label="${esc(t('o.prog', { p: pct }))}"><i style="width:${pct}%"></i></div>
          <div class="lab"><span>${t('o.total', { d: days(span) })}</span><span>${left > 0 ? t('o.left', { d: days(left) }) : left === 0 ? t('o.today') : t('o.late', { d: days(-left) })}</span></div></div>
      </article>`;
    };
    $('view-orders').innerHTML = `<h2 class="sec" style="margin-top:18px">${t('o.title', { n: open.length })}</h2>
      <div class="orders">${open.length ? open.map(card).join('') : `<div class="empty">${t('o.empty')}</div>`}</div>`;
  }

  function render() {
    renderStats(); renderChips(); renderList(); renderOrders();
    $('view-stock').hidden = tab !== 'stock'; $('view-orders').hidden = tab !== 'orders';
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  }

  /* ---------- Sprache und Helligkeit ---------- */
  const themeNow = () => { const a = document.documentElement.getAttribute('data-theme'); return a || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); };
  function applyTheme() {
    const dark = themeNow() === 'dark', b = $('themebtn'), tl = dark ? t('theme.toLight') : t('theme.toDark');
    b.textContent = dark ? '☀️' : '🌙'; b.title = tl; b.setAttribute('aria-label', tl);
  }
  function applyLang(l) {
    LANG = l === 'en' ? 'en' : 'de'; document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
    document.querySelectorAll('[data-i-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.iAria)));
    document.querySelectorAll('[data-i-ph]').forEach(e => e.setAttribute('placeholder', t(e.dataset.iPh)));
    $('langbtn').textContent = t('lang.btn'); $('langbtn').title = t('lang.aria'); $('langbtn').setAttribute('aria-label', t('lang.aria'));
    const keep = cat; $('cat').innerHTML = `<option value="alle">${t('cat.all')}</option>` + Object.keys(I18N.de).filter(k => k.startsWith('type.') && P.some(p => 'type.' + p.type === k)).map(k => `<option value="${k.slice(5)}">${t(k)}</option>`).join(''); $('cat').value = keep;
    applyTheme(); render();
  }

  /* ---------- Bedienung (nur ansehen) ---------- */
  document.addEventListener('click', e => {
    const tg = e.target.closest('[data-tab],[data-toggle],[data-f],#themebtn,#langbtn'); if (!tg) return;
    if (tg.dataset.tab) { tab = tg.dataset.tab; render(); }
    else if (tg.dataset.toggle) { const id = tg.dataset.toggle; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render(); const b = document.querySelector(`[data-toggle="${id}"]`); if (b) b.focus({ preventScroll: true }); }
    else if (tg.dataset.f) { filter = tg.dataset.f; render(); }
    else if (tg.id === 'themebtn') { const next = themeNow() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem(KEY, next); } catch (er) { /* ignorieren */ } applyTheme(); }
    else if (tg.id === 'langbtn') { const l = LANG === 'de' ? 'en' : 'de'; applyLang(l); try { localStorage.setItem(KEY + '-lang', l); } catch (er) { /* ignorieren */ } }
  });
  $('q').addEventListener('input', e => { term = e.target.value; renderList(); });
  $('sort').addEventListener('change', e => { sortBy = e.target.value; renderList(); });
  $('cat').addEventListener('change', e => { cat = e.target.value; renderList(); });

  try { const th = localStorage.getItem(KEY); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { /* ignorieren */ }
