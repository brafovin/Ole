<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brawler</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--yellow:#facc15;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:24px}
  h1{font-size:clamp(32px,8vw,56px);margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--yellow);text-shadow:0 3px 0 #92400e}
  .panel{background:var(--panel);border-radius:16px;padding:16px}
  #arena{width:100%;aspect-ratio:8/5;display:block;border-radius:12px;background:#14532d;touch-action:none;cursor:crosshair}
  .bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .bar .who{font-weight:800}
  button{font:inherit;color:inherit;border:0;touch-action:manipulation;cursor:pointer}
  .act{font-weight:800;border-radius:12px;padding:12px 20px;color:#fff}
  #atk{background:var(--red)}
  #sup{background:#475569}
  #sup.ready{background:var(--yellow);color:#422006}
  .act:active{transform:translateY(1px)}
  .hint{color:var(--muted);font-size:13px;flex-basis:100%}
  .rarity{display:grid;gap:12px}
  .rarity h2{margin:0;display:flex;align-items:center;gap:10px;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
  .rarity h2 span{font-size:13px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .brawler{background:var(--panel);border-radius:16px;padding:14px;text-align:left;display:grid;gap:8px;border:3px solid transparent;border-top:6px solid var(--c)}
  .brawler:hover{background:#273449}
  .brawler.sel{border-color:var(--c);border-top-width:6px}
  .brawler canvas{width:100%;height:96px;background:#14532d;border-radius:10px}
  .brawler h3{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
  .brawler h3 small{font-size:12px;color:var(--muted);font-weight:600}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .mini b{display:block;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0}
  .move{font-size:13px;color:var(--muted);line-height:1.35}
  .move strong{color:var(--yellow)}
  .note{color:var(--muted);font-size:12px;margin:0}
</style>
</head>
<body>
<main>
  <h1>Brawler</h1>

  <section class="panel">
    <canvas id="arena" width="800" height="500" aria-label="Trainingsarena"></canvas>
    <div class="bar">
      <span class="who" id="who">Shelly</span>
      <button class="act" id="atk">Angriff</button>
      <button class="act" id="sup">Super</button>
      <span class="hint">Brawler unten antippen zum Wechseln · Bewegen: WASD / Pfeiltasten oder Finger ziehen · Zielen: Maus · Angriff: Klick / Leertaste · Super: E</span>
    </div>
  </section>

  <div id="rarities" class="rarity"></div>
  <p class="note">Werte sind nur ungefähr und dienen dem Training in der Arena.</p>
</main>

<script>
(() => {
  /* ---------- Daten ---------- */
  const RARITIES = [
    { id: 'start',  name: 'Start',  color: '#94a3b8', info: 'Jeder Spieler beginnt mit diesem Brawler' },
    { id: 'selten', name: 'Selten', color: '#22c55e', info: '8 Brawler' },
  ];

  const BRAWLERS = [
    { id:'shelly', rarity:'start', name:'Shelly', role:'Schadensausteiler', hp:3600, speed:190, size:1,
      look:{ skin:'#e8b48a', hair:'#a855f7', body:'#7e22ce', accent:'#facc15', weapon:'gun', wc:'#334155', len:24 },
      atkName:'Schrotflinte', atkText:'5 Kugeln im Fächer, 300 Schaden pro Kugel.',
      supName:'Superschuss', supText:'9 Kugeln mit mehr Reichweite und Rückstoß.',
      atk:{ type:'pellets', n:5, spread:.28, dmg:300, sp:720, life:.27 },
      sup:{ type:'pellets', n:9, spread:.5, dmg:320, sp:760, life:.42, knock:.03 } },

    { id:'colt', rarity:'selten', name:'Colt', role:'Schadensausteiler', hp:3600, speed:190, size:1,
      look:{ skin:'#e8b48a', hair:'#7c2d12', body:'#1d4ed8', accent:'#f8fafc', weapon:'gun', wc:'#94a3b8', len:22, hat:'#92400e' },
      atkName:'Sechsschuss', atkText:'6 Kugeln in einer Linie auf große Entfernung.',
      supName:'Kugelhagel', supText:'12 durchschlagende Kugeln in einer Linie.',
      atk:{ type:'pellets', n:6, spread:.05, dmg:300, sp:900, life:.55 },
      sup:{ type:'pellets', n:12, spread:.06, dmg:300, sp:1000, life:.6, pierce:true } },

    { id:'nita', rarity:'selten', name:'Nita', role:'Schadensausteiler', hp:4000, speed:190, size:1,
      look:{ skin:'#c68642', hair:'#1c1917', body:'#b45309', accent:'#fde68a', weapon:'none' },
      atkName:'Druckwelle', atkText:'Eine durchschlagende Welle, 800 Schaden.',
      supName:'Bär Bruce', supText:'Ruft einen Bären, der Gegner jagt und zuschlägt.',
      atk:{ type:'pellets', n:1, spread:0, dmg:800, sp:520, life:.5, r:13, pierce:true, color:'#bfdbfe' },
      sup:{ type:'bear', time:6 } },

    { id:'bull', rarity:'selten', name:'Bull', role:'Tank', hp:5000, speed:210, size:1.15,
      look:{ skin:'#d19a6a', hair:null, body:'#475569', accent:'#ef4444', weapon:'gun', wc:'#1e293b', len:20, ring:true },
      atkName:'Doppellauf', atkText:'Breite Schrotsalve mit sehr kurzer Reichweite.',
      supName:'Stieransturm', supText:'Rast nach vorn und rammt alles auf dem Weg.',
      atk:{ type:'pellets', n:5, spread:.4, dmg:280, sp:700, life:.2 },
      sup:{ type:'dash', dist:260, dmg:1000 } },

    { id:'brock', rarity:'selten', name:'Brock', role:'Scharfschütze', hp:3400, speed:190, size:1,
      look:{ skin:'#e8b48a', hair:'#1e3a8a', body:'#0f766e', accent:'#fde047', weapon:'tube', wc:'#f97316', goggles:true },
      atkName:'Raketenwerfer', atkText:'Weitreichende Rakete mit Explosion, 1000 Schaden.',
      supName:'Raketenregen', supText:'6 Raketen prasseln auf ein Zielgebiet.',
      atk:{ type:'rocket', sp:760, life:.6, aoe:48, dmg:1000 },
      sup:{ type:'rain', count:6, area:90, aoe:56, dmg:600 } },

    { id:'primo', rarity:'selten', name:'El Primo', role:'Tank', hp:6000, speed:200, size:1.3,
      look:{ skin:'#d19a6a', hair:null, body:'#dc2626', accent:'#facc15', weapon:'fists', glove:'#facc15', mask:'#dc2626' },
      atkName:'Fliegende Fäuste', atkText:'Mehrere Schläge direkt vor ihm.',
      supName:'Absprung', supText:'Springt zum Ziel und löst eine Druckwelle aus.',
      atk:{ type:'pellets', n:6, spread:.5, dmg:250, sp:600, life:.14 },
      sup:{ type:'slam', dist:280, r:95, dmg:1200 } },

    { id:'barley', rarity:'selten', name:'Barley', role:'Werfer', hp:3400, speed:190, size:1,
      look:{ skin:'#cbd5e1', hair:null, body:'#92400e', accent:'#e5e7eb', weapon:'bottle', wc:'#65a30d', hat:'#475569' },
      atkName:'Flaschenwurf', atkText:'Wirft eine Flasche, die eine Pfütze hinterlässt.',
      supName:'Giftrunde', supText:'Riesige Flasche mit großer, ätzender Pfütze.',
      atk:{ type:'lob', range:320, dmg:400, puddle:{ r:42, time:2.5, tick:140 } },
      sup:{ type:'lob', range:340, dmg:500, puddle:{ r:72, time:3.2, tick:200 } } },

    { id:'poco', rarity:'selten', name:'Poco', role:'Unterstützer', hp:3800, speed:190, size:1,
      look:{ skin:'#f1f5f9', hair:null, body:'#7c3aed', accent:'#f472b6', weapon:'guitar', wc:'#b45309', hat:'#a16207', hollow:true },
      atkName:'Gitarrenwelle', atkText:'Breite Schallwelle, trifft mehrere Gegner.',
      supName:'Liebeslied', supText:'Große Welle, die Verbündete heilen würde.',
      atk:{ type:'pellets', n:3, spread:.5, dmg:450, sp:650, life:.35, pierce:true, color:'#f9a8d4' },
      sup:{ type:'pellets', n:9, spread:.55, dmg:500, sp:800, life:.6, pierce:true, color:'#f9a8d4', heal:true } },

    { id:'rosa', rarity:'selten', name:'Rosa', role:'Tank', hp:5000, speed:200, size:1.1,
      look:{ skin:'#a16207', hair:'#166534', body:'#15803d', accent:'#f9a8d4', weapon:'fists', glove:'#ec4899' },
      atkName:'Boxhandschuhe', atkText:'Schnelle Schläge auf kurze Distanz.',
      supName:'Pflanzenschild', supText:'4 Sekunden Schild und schneller unterwegs.',
      atk:{ type:'pellets', n:6, spread:.45, dmg:220, sp:600, life:.14 },
      sup:{ type:'shield', time:4 } },
  ];
  const byId = Object.fromEntries(BRAWLERS.map(b => [b.id, b]));
  const TAU = Math.PI * 2;

  /* ---------- Zeichnen ---------- */
  function drawWeapon(c, L, recoil) {
    const w = L.weapon, back = -recoil;
    if (w === 'gun') {
      c.fillStyle = '#78350f'; c.fillRect(2 + back, -4, 14, 8);
      c.fillStyle = L.wc; c.fillRect(14 + back, -3.5, L.len, 7);
      c.fillStyle = '#1e293b'; c.fillRect(14 + L.len - 4 + back, -3.5, 5, 7);
    } else if (w === 'tube') {
      c.fillStyle = L.wc; c.fillRect(4 + back, -6, 34, 12);
      c.fillStyle = '#1e293b'; c.fillRect(36 + back, -7, 5, 14);
    } else if (w === 'bottle') {
      c.fillStyle = L.wc; c.fillRect(14, -5, 14, 10); c.fillRect(28, -2, 8, 4);
      c.fillStyle = '#fef3c7'; c.fillRect(17, -3, 6, 6);
    } else if (w === 'guitar') {
      c.fillStyle = L.wc; c.beginPath(); c.ellipse(18 + back, 0, 11, 9, 0, 0, TAU); c.fill();
      c.fillStyle = '#451a03'; c.fillRect(24 + back, -2, 18, 4);
      c.beginPath(); c.arc(18 + back, 0, 3, 0, TAU); c.fill();
    } else if (w === 'fists') {
      const f = 22 + recoil;
      c.fillStyle = L.glove;
      c.beginPath(); c.arc(f, -9, 8, 0, TAU); c.arc(f, 9, 8, 0, TAU); c.fill();
    } else if (L.weapon === 'none') {
      c.fillStyle = '#e8b48a'; c.beginPath(); c.arc(18, 0, 6, 0, TAU); c.fill();
    }
  }
  function drawBrawler(c, B, x, y, aim, recoil, scale, opt = {}) {
    const L = B.look, s = scale * B.size;
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 18 * s, 18 * s, 7 * s, 0, 0, TAU); c.fill();
    c.translate(0, -(opt.z || 0)); c.scale(s, s);
    c.save(); c.rotate(aim); drawWeapon(c, L, recoil); c.restore();
    // Körper
    c.fillStyle = L.body; c.beginPath(); c.arc(0, 4, 16, 0, TAU); c.fill();
    c.fillStyle = L.accent; c.fillRect(-3, -4, 6, 16);
    if (L.ring) { c.strokeStyle = '#facc15'; c.lineWidth = 3; c.beginPath(); c.arc(0, -4, 7, 0, TAU); c.stroke(); }
    // Kopf
    c.fillStyle = L.mask || L.skin; c.beginPath(); c.arc(0, -8, 11, 0, TAU); c.fill();
    if (L.mask) { c.fillStyle = L.accent; c.beginPath(); c.ellipse(-4, -8, 4, 3.5, 0, 0, TAU); c.ellipse(4, -8, 4, 3.5, 0, 0, TAU); c.fill(); }
    if (L.hair) {
      c.fillStyle = L.hair; c.beginPath(); c.arc(0, -11, 12, Math.PI, 0); c.fill();
      c.beginPath(); c.arc(-11, -6, 4.5, 0, TAU); c.arc(11, -6, 4.5, 0, TAU); c.fill();
    }
    // Augen
    const ex = Math.cos(aim) * 2, ey = Math.sin(aim) * 1.5;
    if (L.hollow) {
      c.fillStyle = '#0f172a'; c.beginPath(); c.arc(-4 + ex, -8 + ey, 3, 0, TAU); c.arc(4 + ex, -8 + ey, 3, 0, TAU); c.fill();
    } else {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(-4, -8, 3, 0, TAU); c.arc(4, -8, 3, 0, TAU); c.fill();
      c.fillStyle = '#111'; c.beginPath(); c.arc(-4 + ex, -8 + ey, 1.5, 0, TAU); c.arc(4 + ex, -8 + ey, 1.5, 0, TAU); c.fill();
    }
    if (L.goggles) {
      c.strokeStyle = '#fde047'; c.lineWidth = 2; c.beginPath(); c.arc(-4, -8, 4, 0, TAU); c.arc(4, -8, 4, 0, TAU); c.stroke();
    }
    if (L.hat) {
      c.fillStyle = L.hat; c.beginPath(); c.ellipse(0, -15, 16, 4.5, 0, 0, TAU); c.fill();
      c.fillRect(-8, -26, 16, 11);
    }
    c.restore();
  }

  /* ---------- Auswahl-Karten ---------- */
  const rangeOf = a => a.type === 'lob' ? a.range : a.sp * a.life;
  const rangeLabel = r => r < 220 ? 'Kurz' : r < 380 ? 'Mittel' : 'Lang';
  const root = document.getElementById('rarities');
  for (const R of RARITIES) {
    const sec = document.createElement('section'); sec.className = 'rarity';
    sec.innerHTML = `<h2><i class="dot" style="--c:${R.color}"></i>${R.name}<span>${R.info}</span></h2><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const B of BRAWLERS.filter(b => b.rarity === R.id)) {
      const el = document.createElement('button');
      el.className = 'brawler'; el.dataset.id = B.id; el.style.setProperty('--c', R.color);
      el.innerHTML = `<canvas width="300" height="120"></canvas>
        <h3>${B.name}<small>${B.role}</small></h3>
        <div class="mini"><div>Leben<b>${B.hp}</b></div><div>Tempo<b>${B.speed >= 205 ? 'Schnell' : 'Normal'}</b></div><div>Reichweite<b>${rangeLabel(rangeOf(B.atk))}</b></div></div>
        <div class="move"><strong>${B.atkName}:</strong> ${B.atkText}</div>
        <div class="move"><strong>${B.supName}:</strong> ${B.supText}</div>`;
      const pc = el.querySelector('canvas').getContext('2d');
      pc.fillStyle = '#166534'; pc.fillRect(0, 0, 300, 120);
      drawBrawler(pc, B, 150, 70, 0.35, 0, 2.2);
      el.addEventListener('click', () => { select(B.id); document.getElementById('arena').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      grid.appendChild(el);
    }
    root.appendChild(sec);
  }

  /* ---------- Spiel ---------- */
  const cv = document.getElementById('arena'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const atkBtn = document.getElementById('atk'), supBtn = document.getElementById('sup'), whoEl = document.getElementById('who');

  let B = BRAWLERS[0];
  const P = { x: W / 2, y: H / 2, ammo: 3, charge: 0, aim: 0, recoil: 0, dash: null, jump: null, shield: 0 };
  let dummies = [], shots = [], fx = [], floaters = [], rings = [], lobs = [], puddles = [], timers = [], bears = [];
  const keys = {};
  let pointer = { x: W / 2 + 100, y: H / 2 }, moveTo = null;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const spawnPos = d => { d.x = rnd(80, W - 80); d.y = rnd(70, H - 70); };
  for (let i = 0; i < 4; i++) { const d = { r: 20, hp: 3000, max: 3000, flash: 0, vx: 0, vy: 0, t: 0, dead: 0 }; spawnPos(d); dummies.push(d); }

  function select(id) {
    B = byId[id];
    Object.assign(P, { x: W / 2, y: H / 2, ammo: 3, charge: 0, recoil: 0, dash: null, jump: null, shield: 0 });
    shots = []; lobs = []; puddles = []; timers = []; bears = []; rings = [];
    whoEl.textContent = B.name;
    document.querySelectorAll('.brawler').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  }

  function pop(x, y, color, n) {
    for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(40, 160); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .35, color }); }
  }
  function hit(d, dmg, src) {
    if (d.hp <= 0) return;
    d.hp -= dmg; d.flash = .12;
    if (src === 'atk') P.charge = Math.min(1, P.charge + dmg / 5000);
    floaters.push({ x: d.x + rnd(-10, 10), y: d.y - 24, t: .6, txt: Math.round(dmg) });
    if (d.hp <= 0) { pop(d.x, d.y, '#f97316', 24); d.dead = 0; }
  }
  function explode(x, y, r, dmg, src) {
    rings.push({ x, y, r, t: .3 }); pop(x, y, '#fb923c', 14);
    for (const d of dummies) if (d.hp > 0 && Math.hypot(d.x - x, d.y - y) < r + d.r) hit(d, dmg, src);
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const toward = (len) => ({ x: clamp(P.x + Math.cos(P.aim) * len, 20, W - 20), y: clamp(P.y + Math.sin(P.aim) * len, 20, H - 20) });
  const muzzle = () => 26 * B.size;

  function pellets(a, src) {
    for (let i = 0; i < a.n; i++) {
      const ang = P.aim + (a.n === 1 ? 0 : (i / (a.n - 1) - .5) * 2 * a.spread) + rnd(-.025, .025);
      const sp = a.sp * rnd(.97, 1.04);
      shots.push({ x: P.x + Math.cos(P.aim) * muzzle(), y: P.y + Math.sin(P.aim) * muzzle(), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: a.life, dmg: a.dmg, r: a.r || 3.5, pierce: !!a.pierce, hit: new Set(), src, knock: a.knock || 0,
        color: a.color || (src === 'sup' ? '#fde047' : '#fb923c') });
    }
  }
  function use(a, src) {
    P.recoil = src === 'sup' ? 14 : 8;
    switch (a.type) {
      case 'pellets': pellets(a, src); if (a.heal) floaters.push({ x: P.x, y: P.y - 40, t: .8, txt: '♥ Heilung' }); break;
      case 'rocket':
        shots.push({ x: P.x + Math.cos(P.aim) * muzzle(), y: P.y + Math.sin(P.aim) * muzzle(), vx: Math.cos(P.aim) * a.sp, vy: Math.sin(P.aim) * a.sp,
          life: a.life, dmg: a.dmg, r: 6, aoe: a.aoe, hit: new Set(), src, color: '#f97316' });
        break;
      case 'lob': {
        const dx = Math.min(a.range, Math.hypot(pointer.x - P.x, pointer.y - P.y));
        const tgt = { x: clamp(P.x + Math.cos(P.aim) * dx, 20, W - 20), y: clamp(P.y + Math.sin(P.aim) * dx, 20, H - 20) };
        lobs.push({ sx: P.x, sy: P.y, tx: tgt.x, ty: tgt.y, t: 0, dur: .5, a, src });
        break;
      }
      case 'dash': P.dash = { vx: Math.cos(P.aim) * a.dist / .27, vy: Math.sin(P.aim) * a.dist / .27, t: .27, hit: new Set(), dmg: a.dmg }; break;
      case 'slam': {
        const dist = Math.min(a.dist, Math.hypot(pointer.x - P.x, pointer.y - P.y));
        P.jump = { sx: P.x, sy: P.y, tx: clamp(P.x + Math.cos(P.aim) * dist, 25, W - 25), ty: clamp(P.y + Math.sin(P.aim) * dist, 25, H - 25), t: 0, dur: .45, a };
        break;
      }
      case 'rain': {
        const c = toward(Math.min(420, Math.hypot(pointer.x - P.x, pointer.y - P.y)));
        for (let i = 0; i < a.count; i++) timers.push({ t: .15 + i * .12, fn: () => explode(clamp(c.x + rnd(-a.area, a.area), 10, W - 10), clamp(c.y + rnd(-a.area, a.area), 10, H - 10), a.aoe, a.dmg, 'sup') });
        break;
      }
      case 'bear': bears.push({ x: P.x + Math.cos(P.aim) * 40, y: P.y + Math.sin(P.aim) * 40, t: a.time, cd: 0 }); break;
      case 'shield': P.shield = a.time; break;
    }
  }
  const blocked = () => P.dash || P.jump;
  function attack() { if (!blocked() && P.ammo >= 1) { P.ammo -= 1; use(B.atk, 'atk'); } }
  function superAttack() { if (!blocked() && P.charge >= 1) { P.charge = 0; use(B.sup, 'sup'); } }

  addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    if (e.repeat) return;
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') attack();
    if (e.key.toLowerCase() === 'e') superAttack();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  const toCanvas = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height }; };
  cv.addEventListener('pointermove', e => { pointer = toCanvas(e); if (e.pointerType === 'touch' && moveTo) moveTo = pointer; });
  cv.addEventListener('pointerdown', e => {
    pointer = toCanvas(e);
    if (e.pointerType === 'touch') { moveTo = pointer; cv.setPointerCapture(e.pointerId); } else attack();
  });
  cv.addEventListener('pointerup', () => { moveTo = null; });
  cv.addEventListener('pointercancel', () => { moveTo = null; });
  atkBtn.addEventListener('click', attack);
  supBtn.addEventListener('click', superAttack);

  let last = performance.now();
  function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }

  function update(dt) {
    const R = 18 * B.size;
    // Bewegung
    if (P.jump) {
      const j = P.jump; j.t += dt; const k = Math.min(1, j.t / j.dur);
      P.x = j.sx + (j.tx - j.sx) * k; P.y = j.sy + (j.ty - j.sy) * k;
      if (k >= 1) { explode(P.x, P.y, j.a.r, j.a.dmg, 'sup'); P.jump = null; }
    } else if (P.dash) {
      const d = P.dash; d.t -= dt;
      P.x = clamp(P.x + d.vx * dt, R, W - R); P.y = clamp(P.y + d.vy * dt, R, H - R);
      for (const m of dummies) if (m.hp > 0 && !d.hit.has(m) && Math.hypot(m.x - P.x, m.y - P.y) < R + m.r) {
        d.hit.add(m); hit(m, d.dmg, 'sup'); m.x += d.vx * .06; m.y += d.vy * .06; pop(m.x, m.y, '#fde047', 8);
      }
      if (d.t <= 0) P.dash = null;
    } else {
      let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
      let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
      if (moveTo) { const tx = moveTo.x - P.x, ty = moveTo.y - P.y, d = Math.hypot(tx, ty); if (d > 12) { dx = tx / d; dy = ty / d; } }
      const len = Math.hypot(dx, dy), sp = B.speed * (P.shield > 0 ? 1.4 : 1);
      if (len) { P.x += dx / len * sp * dt; P.y += dy / len * sp * dt; }
      P.x = clamp(P.x, R, W - R); P.y = clamp(P.y, R, H - R);
    }
    P.aim = Math.atan2(pointer.y - P.y, pointer.x - P.x);
    P.ammo = Math.min(3, P.ammo + dt / 1.3);
    P.recoil = Math.max(0, P.recoil - dt * 60);
    P.shield = Math.max(0, P.shield - dt);

    // Geschosse
    for (const p of shots) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      for (const d of dummies) {
        if (d.hp <= 0 || p.hit.has(d) || Math.hypot(p.x - d.x, p.y - d.y) >= d.r + p.r) continue;
        if (p.aoe) { p.life = 0; break; }
        hit(d, p.dmg, p.src); pop(p.x, p.y, '#fde047', 3);
        if (p.knock) { d.x += p.vx * p.knock; d.y += p.vy * p.knock; }
        if (p.pierce) p.hit.add(d); else { p.life = 0; break; }
      }
      if (p.life <= 0 && p.aoe) explode(p.x, p.y, p.aoe, p.dmg, p.src);
    }
    shots = shots.filter(p => p.life > 0 && p.x > -30 && p.x < W + 30 && p.y > -30 && p.y < H + 30);

    // Flaschen & Pfützen
    for (const l of lobs) {
      l.t += dt;
      if (l.t >= l.dur) {
        const pd = l.a.puddle; explode(l.tx, l.ty, pd.r, l.a.dmg, l.src);
        puddles.push({ x: l.tx, y: l.ty, r: pd.r, t: pd.time, max: pd.time, tick: 0, dmg: pd.tick, src: l.src }); l.done = true;
      }
    }
    lobs = lobs.filter(l => !l.done);
    for (const p of puddles) {
      p.t -= dt; p.tick -= dt;
      if (p.tick <= 0) { p.tick = .25; for (const d of dummies) if (d.hp > 0 && Math.hypot(d.x - p.x, d.y - p.y) < p.r + d.r) hit(d, p.dmg, p.src); }
    }
    puddles = puddles.filter(p => p.t > 0);

    // Zeitgesteuerte Effekte (Raketenregen)
    for (const t of timers) { t.t -= dt; if (t.t <= 0) { t.fn(); t.done = true; } }
    timers = timers.filter(t => !t.done);

    // Bär
    for (const b of bears) {
      b.t -= dt; b.cd -= dt;
      let tg = null, best = 1e9;
      for (const d of dummies) { const m = Math.hypot(d.x - b.x, d.y - b.y); if (d.hp > 0 && m < best) { best = m; tg = d; } }
      if (tg) {
        if (best > 34) { b.x += (tg.x - b.x) / best * 170 * dt; b.y += (tg.y - b.y) / best * 170 * dt; }
        else if (b.cd <= 0) { b.cd = .5; hit(tg, 400, 'sup'); pop(tg.x, tg.y, '#fde047', 6); }
      }
    }
    bears = bears.filter(b => b.t > 0);

    // Übungspuppen
    for (const d of dummies) {
      if (d.hp <= 0) { d.dead += dt; if (d.dead > 1.5) { d.hp = d.max; spawnPos(d); } continue; }
      d.t -= dt; if (d.t <= 0) { d.t = rnd(1, 3); const a = rnd(0, TAU); d.vx = Math.cos(a) * 35; d.vy = Math.sin(a) * 35; }
      d.x = clamp(d.x + d.vx * dt, d.r, W - d.r); d.y = clamp(d.y + d.vy * dt, d.r, H - d.r);
      d.flash = Math.max(0, d.flash - dt);
    }
    for (const f of fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; }
    fx = fx.filter(f => f.life > 0);
    for (const f of floaters) { f.y -= 40 * dt; f.t -= dt; }
    floaters = floaters.filter(f => f.t > 0);
    for (const r of rings) r.t -= dt;
    rings = rings.filter(r => r.t > 0);

    supBtn.classList.toggle('ready', P.charge >= 1);
    supBtn.textContent = P.charge >= 1 ? B.supName.toUpperCase() + '!' : 'Super ' + Math.floor(P.charge * 100) + '%';
    atkBtn.textContent = 'Angriff ' + '●'.repeat(Math.floor(P.ammo)) + '○'.repeat(3 - Math.floor(P.ammo));
  }

  function draw() {
    ctx.fillStyle = '#166534'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    for (let x = 0; x < W; x += 80) for (let y = 0; y < H; y += 80) if ((x + y) / 80 % 2 === 0) ctx.fillRect(x, y, 80, 80);

    for (const p of puddles) {
      ctx.globalAlpha = .35 + .25 * (p.t / p.max); ctx.fillStyle = '#84cc16';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const d of dummies) {
      if (d.hp <= 0) continue;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(d.x, d.y + 16, 18, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = d.flash > 0 ? '#fff' : '#b45309'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7f1d1d'; ctx.fillRect(d.x - 20, d.y - 34, 40, 6);
      ctx.fillStyle = '#22c55e'; ctx.fillRect(d.x - 20, d.y - 34, 40 * d.hp / d.max, 6);
    }

    for (const b of bears) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(b.x, b.y + 16, 18, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(b.x, b.y, 17, 0, TAU); ctx.arc(b.x - 11, b.y - 14, 6, 0, TAU); ctx.arc(b.x + 11, b.y - 14, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(b.x, b.y + 4, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(b.x - 5, b.y - 3, 2, 0, TAU); ctx.arc(b.x + 5, b.y - 3, 2, 0, TAU); ctx.fill();
    }

    const z = P.jump ? Math.sin(Math.PI * Math.min(1, P.jump.t / P.jump.dur)) * 80 : 0;
    drawBrawler(ctx, B, P.x, P.y, P.aim, P.recoil, 1, { z });
    if (P.shield > 0) {
      ctx.strokeStyle = 'rgba(134,239,172,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(P.x, P.y, 30 * B.size, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(134,239,172,.2)'; ctx.fill();
    }

    for (const l of lobs) {
      const k = l.t / l.dur, x = l.sx + (l.tx - l.sx) * k, y = l.sy + (l.ty - l.sy) * k - Math.sin(Math.PI * k) * 70;
      ctx.fillStyle = '#65a30d'; ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(l.tx, l.ty, l.a.puddle.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const p of shots) {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.aoe ? 6 : p.r + (p.src === 'sup' ? 1 : 0), 0, TAU); ctx.fill();
    }
    for (const r of rings) {
      ctx.globalAlpha = r.t / .3; ctx.fillStyle = '#fdba74'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1.1 - r.t / .3 * .3), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of fx) { ctx.globalAlpha = Math.max(0, f.life / .35); ctx.fillStyle = f.color; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.font = '800 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3;
    for (const f of floaters) { ctx.strokeStyle = '#000'; ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = typeof f.txt === 'string' ? '#86efac' : '#fde047'; ctx.fillText(f.txt, f.x, f.y); }

    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 8, 0, TAU); ctx.moveTo(pointer.x - 13, pointer.y); ctx.lineTo(pointer.x + 13, pointer.y);
    ctx.moveTo(pointer.x, pointer.y - 13); ctx.lineTo(pointer.x, pointer.y + 13); ctx.stroke();

    const top = P.y - 42 * B.size - z;
    ctx.fillStyle = '#1e293b'; ctx.fillRect(P.x - 24, top, 48, 8);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(P.x - 23, top + 1, 46, 6);
    ctx.fillStyle = '#fff'; ctx.font = '800 11px system-ui,sans-serif'; ctx.fillText(B.name.toUpperCase(), P.x, top - 5);
  }

  select('shelly');
  requestAnimationFrame(frame);
})();
</script>
</body>
