<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from '../src/three.js';
import { buildCharacter } from '../src/characters/CharacterBuilder.js';
import { CHARACTERS, NPCS, BOSS_SPEC, playerSpec } from '../src/characters/definitions.js';
import { Animator } from '../src/characters/Animator.js';
import { glowTexture } from '../src/gfx/textures.js';
import { ENEMY_TYPES, buildCrawler } from '../src/enemies/types.js';
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'all';
const pose = params.get('pose');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1420);
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
scene.add(new THREE.HemisphereLight(0x8090c0, 0x201010, 0.9));
const d = new THREE.DirectionalLight(0xffe0e0, 2.2); d.position.set(2, 4, 5); scene.add(d);
const p = new THREE.PointLight(0xff3040, 6, 10); p.position.set(-2, 2, 2); scene.add(p);
const glow = glowTexture(64);
const list = [];
try {
  const ids = view === 'all' ? ['lucien','seraphina','kairo'] : view === 'npc' ? ['elise','doran','marta','countess'] : view === 'enemies' ? ['crawler','knight','stalker','mage'] : [view];
  ids.forEach((id, i) => {
    let spec;
    if (id === 'crawler') {
      const c = buildCrawler();
      c.root.position.x = (i - (ids.length - 1) / 2) * 1.6;
      c.root.rotation.y = 0.6;
      scene.add(c.root);
      c.animate(0.016, 0.3, 0, 'idle', 0);
      return;
    }
    if (ENEMY_TYPES[id] && ENEMY_TYPES[id].spec) spec = { ...ENEMY_TYPES[id].spec, glowTex: glow };
    else if (CHARACTERS[id]) spec = playerSpec(id, params.get('cos') || 'default', glow);
    else if (id === 'countess') spec = { ...BOSS_SPEC, glowTex: glow };
    else spec = { ...NPCS[id], glowTex: glow };
    const m = buildCharacter(spec);
    m.root.position.x = (i - (ids.length - 1) / 2) * (view === 'enemies' ? 1.6 : 1.3);
    m.root.rotation.y = params.get('back') ? Math.PI : (params.get('rot') ? parseFloat(params.get('rot')) : 0.25);
    scene.add(m.root);
    const style = CHARACTERS[id] ? CHARACTERS[id].combat : ENEMY_TYPES[id] ? ENEMY_TYPES[id].style : (id === 'countess' ? 'boss' : 'npc');
    const an = new Animator(m, style);
    if (pose) an.play(pose, 1, { hold: true });
    list.push({ m, an });
  });
  const close = params.get('close');
  if (close) { cam.position.set(list.length > 1 ? 0 : list[0].m.root.position.x, 1.62 * (view==='countess'?1.35:1), 1.2); cam.lookAt(cam.position.x, 1.62*(view==='countess'?1.35:1), 0); cam.fov = 22; cam.updateProjectionMatrix(); }
  else { cam.position.set(0, 1.3, 6.5); cam.lookAt(0, 1.0, 0); }
  const t = parseFloat(params.get('t') || '0.5');
  for (let f = 0; f < 30; f++) list.forEach(({ m, an }) => { an.update(t / 30, { speed: parseFloat(params.get('speed') || '0'), grounded: true }); m.updateSecondary(t/30, new THREE.Vector3(0,0,parseFloat(params.get('speed')||'0')), f/30); });
  renderer.render(scene, cam);
  window.__done = true;
} catch (e) { console.error('ERR', e.stack); window.__err = e.stack; window.__done = true; }
</script></body></html>
