<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Shop – T-Shirts &amp; Hosen</title>
<style>
  :root{--bg:#f7f6f3;--card:#fff;--text:#1c1b1a;--muted:#6f6b66;--line:#e6e2dc;--accent:#1f3a5f;--accent-d:#162b47;--ok:#1f7a4d;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f2efea;--muted:#a09a92;--line:#33312f;--accent:#7aa7e0;--accent-d:#a5c4ee}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.45}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:16px;height:60px}
  .logo{font-weight:800;font-size:20px;letter-spacing:.02em;text-decoration:none;color:var(--text)}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:6px;margin-left:8px}
  nav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted)}
  nav button.on{background:var(--accent);color:#fff}
  .spacer{flex:1}
  .cartbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
  .cartbtn b{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 5px}
  .cartbtn b[hidden]{display:none}
  .hero{padding:36px 0 18px}
  .hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,44px);line-height:1.1}
  .hero p{margin:0;color:var(--muted)}
  .tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 18px;flex-wrap:wrap}
  .tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .count{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding-bottom:48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .pic{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(160deg,#ece8e1,#dcd6cc);cursor:pointer;position:relative}
  @media (prefers-color-scheme:dark){.pic{background:linear-gradient(160deg,#2b2a28,#222120)}}
  .pic svg{width:78%;height:78%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
  .tag{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
  .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .info h3{margin:0;font-size:16px}
  .info .meta{color:var(--muted);font-size:13px}
  .price{font-weight:800;font-size:18px;margin-top:2px}
  .price s{color:var(--muted);font-weight:500;font-size:14px;margin-left:6px}
  .swatches{display:flex;gap:5px;margin-top:2px}
  .swatches i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:block}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700}
  .primary:hover{background:var(--accent-d)}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600}
  .card .primary{margin-top:auto}
  /* Dialoge */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border-radius:18px;display:none}
  .modal.open{display:grid;grid-template-columns:1fr 1fr}
  @media (max-width:640px){.modal.open{grid-template-columns:1fr}}
  .modal .pic{aspect-ratio:auto;min-height:280px;cursor:default}
  .detail{padding:22px;display:flex;flex-direction:column;gap:10px}
  .detail h2{margin:0}
  .detail p{margin:0;color:var(--muted)}
  .sizes{display:flex;gap:8px;flex-wrap:wrap}
  .sizes button{min-width:48px;padding:9px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
  .sizes button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .sizes button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
  .err{color:var(--bad);font-size:14px;min-height:20px}
  .x{position:absolute;top:10px;right:10px;background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:18px;z-index:2}
  /* Warenkorb */
  .drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--card);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer h2{margin:0;padding:18px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .lines{flex:1;overflow:auto;padding:6px 18px}
  .line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .line .pic{aspect-ratio:1/1;border-radius:10px;width:64px;cursor:default}
  .line .pic svg{width:80%;height:80%}
  .line h4{margin:0;font-size:15px}
  .line .meta{color:var(--muted);font-size:13px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;margin-top:6px}
  .qty button{background:none;border:0;width:30px;height:30px;font-size:16px}
  .qty span{min-width:22px;text-align:center;font-weight:700}
  .rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;display:block;margin-top:4px;padding:0}
  .sum{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:8px}
  .sum .row{display:flex;justify-content:space-between}
  .sum .total{font-size:19px;font-weight:800}
  .ship{font-size:13px;color:var(--muted)}
  .bar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar2 i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
  .empty{color:var(--muted);text-align:center;padding:48px 0}
  /* Kasse */
  .checkout{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border-radius:18px;padding:22px;display:none}
  .checkout.open{display:block}
  .checkout h2{margin:0 0 4px}
  .checkout form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .checkout label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
  .checkout label.full{grid-column:1/-1}
  .checkout input,.checkout select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}
  .checkout input:invalid:not(:placeholder-shown){border-color:var(--bad)}
  .note{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px}
  .done{text-align:center;padding:12px 0}
  .done .ok{font-size:48px}
  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="#">MEIN<span>SHOP</span></a>
    <nav id="nav">
      <button data-cat="alle" class="on">Alle</button>
      <button data-cat="tshirt">T-Shirts</button>
      <button data-cat="hose">Hosen</button>
    </nav>
    <div class="spacer"></div>
    <button class="cartbtn" id="cartbtn" aria-label="Warenkorb öffnen">🛒 Warenkorb <b id="cartcount" hidden>0</b></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>T-Shirts &amp; Hosen für jeden Tag</h1>
    <p>Bequem, ehrlich im Preis – ab 60 € versandkostenfrei.</p>
  </section>
  <div class="tools">
    <span class="count" id="count"></span>
    <select id="sort" aria-label="Sortierung">
      <option value="neu">Empfohlen</option>
      <option value="auf">Preis aufsteigend</option>
      <option value="ab">Preis absteigend</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">© Mein Shop · Preise inkl. MwSt. · Versand 4,90 € (ab 60 € gratis) · 14 Tage Rückgabe · Demo-Shop: es wird nichts wirklich bestellt oder bezahlt.</div></footer>

<div class="scrim" id="scrim"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <button class="x" id="mclose" aria-label="Schließen">✕</button>
  <div class="pic" id="mpic"></div>
  <div class="detail">
    <h2 id="mtitle"></h2>
    <div class="price" id="mprice"></div>
    <p id="mdesc"></p>
    <div><b>Größe</b></div>
    <div class="sizes" id="msizes"></div>
    <div class="err" id="merr"></div>
    <button class="primary" id="madd">In den Warenkorb</button>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Warenkorb">
  <h2>Warenkorb <button class="ghost" id="dclose" style="padding:6px 12px">Schließen</button></h2>
  <div class="lines" id="lines"></div>
  <div class="sum" id="sum"></div>
</aside>

<div class="checkout" id="checkout" role="dialog" aria-modal="true" aria-labelledby="ctitle"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  /* ---------- Produkte (hier einfach bearbeiten) ---------- */
  // type: tshirt | hose · colors: [Name, Farbe] · sizes: verfügbare Größen · old: alter Preis (optional)
  const ALL_SIZES = ['S', 'M', 'L', 'XL'];
  const PRODUCTS = [
    { id: 't1', type: 'tshirt', name: 'Basic Tee Weiß',      price: 19.90, color: '#f4f2ee', sizes: ['S','M','L','XL'], desc: 'Weiches Jersey aus 100 % Baumwolle, normale Passform, Rundhals. Das T-Shirt für alles.' },
    { id: 't2', type: 'tshirt', name: 'Basic Tee Schwarz',   price: 19.90, color: '#232323', sizes: ['S','M','L','XL'], desc: 'Weiches Jersey aus 100 % Baumwolle, normale Passform, Rundhals. Bleibt tief schwarz.' },
    { id: 't3', type: 'tshirt', name: 'Heavy Tee Navy',      price: 27.90, color: '#223a63', sizes: ['M','L','XL'],     desc: 'Schweres 220-g-Jersey, leicht oversized. Hält die Form auch nach vielen Wäschen.' },
    { id: 't4', type: 'tshirt', name: 'Heavy Tee Salbei',    price: 27.90, color: '#8fa58a', sizes: ['S','M','L'],      desc: 'Schweres 220-g-Jersey in sanftem Grün, leicht oversized.' },
    { id: 't5', type: 'tshirt', name: 'Streifen Tee',        price: 24.90, old: 29.90, color: '#c8d3e2', stripe: '#223a63', sizes: ['S','M','L','XL'], desc: 'Klassisches Bretonshirt-Muster auf fließender Baumwolle. Jetzt im Angebot.' },
    { id: 't6', type: 'tshirt', name: 'Pocket Tee Rot',      price: 22.90, color: '#b3382c', sizes: ['S','M','L','XL'], desc: 'Mit aufgesetzter Brusttasche. Kräftiges Rot, das nicht ausbleicht.' },
    { id: 'h1', type: 'hose',   name: 'Chino Sand',          price: 49.90, color: '#c9b48f', sizes: ['S','M','L','XL'], desc: 'Gerade geschnittene Chino aus elastischer Baumwolle. Passt zu Büro und Wochenende.' },
    { id: 'h2', type: 'hose',   name: 'Jeans Slim Blau',     price: 59.90, color: '#34527a', sizes: ['S','M','L','XL'], desc: 'Slim-Fit-Jeans aus Stretch-Denim. Fünf Taschen, stabile Nähte.' },
    { id: 'h3', type: 'hose',   name: 'Jogger Grau',         price: 39.90, color: '#8a8d92', sizes: ['S','M','L','XL'], desc: 'Bequeme Jogginghose mit Bund zum Binden und Bündchen am Saum.' },
    { id: 'h4', type: 'hose',   name: 'Cargo Oliv',          price: 54.90, old: 64.90, color: '#6b6f3f', sizes: ['M','L','XL'], desc: 'Robuste Cargohose mit großen Seitentaschen. Jetzt im Angebot.' },
    { id: 'h5', type: 'hose',   name: 'Leinenhose Natur',    price: 44.90, color: '#d9cdb6', sizes: ['S','M','L'],      desc: 'Luftige Sommerhose aus Leinenmix mit Gummizug.' },
    { id: 'h6', type: 'hose',   name: 'Stoffhose Schwarz',   price: 64.90, color: '#252525', sizes: ['S','M','L','XL'], desc: 'Schmal geschnittene Stoffhose mit Bügelfalte. Für alles, was schick sein soll.' },
  ];
  const FREE_SHIP = 60, SHIPPING = 4.90, MAX_QTY = 10;
  const eur = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const $ = id => document.getElementById(id);
  const byId = id => PRODUCTS.find(p => p.id === id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- Bilder (gezeichnet, damit keine Fotos nötig sind) ---------- */
  function shade(hex, k) { // k < 0 dunkler, k > 0 heller
    const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c + (k < 0 ? c * k : (255 - c) * k))));
    return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
  }
  function picture(p) {
    const c = p.color, d = shade(c, -.18), l = shade(c, .18);
    if (p.type === 'tshirt') {
      const stripes = p.stripe ? Array.from({ length: 7 }, (_, i) => `<rect x="40" y="${84 + i * 24}" width="120" height="9" fill="${p.stripe}" clip-path="url(#cl${p.id})"/>`).join('') : '';
      const pocket = p.name.includes('Pocket') ? `<rect x="118" y="82" width="26" height="30" rx="3" fill="${d}" opacity=".55"/>` : '';
      const body = 'M62 24 L38 36 L10 70 L34 90 L50 76 L50 188 Q100 198 150 188 L150 76 L166 90 L190 70 L162 36 L138 24 Q100 44 62 24 Z';
      return `<svg viewBox="0 0 200 210" role="img" aria-label="${esc(p.name)}"><defs><clipPath id="cl${p.id}"><path d="${body}"/></clipPath></defs>
        <path d="${body}" fill="${c}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/>${stripes}
        <path d="M62 24 Q100 44 138 24 Q100 56 62 24 Z" fill="${d}" opacity=".55"/><path d="M50 76 L50 188 Q60 190 70 191 L70 80 Z" fill="${l}" opacity=".18"/>${pocket}</svg>`;
    }
    const body = 'M52 14 L148 14 L156 70 L152 196 L108 196 L100 92 L92 196 L48 196 L44 70 Z';
    return `<svg viewBox="0 0 200 210" role="img" aria-label="${esc(p.name)}">
      <path d="${body}" fill="${c}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/>
      <rect x="52" y="14" width="96" height="12" fill="${d}" opacity=".5"/><path d="M100 26 L100 92" stroke="${d}" stroke-width="2" opacity=".6"/>
      <path d="M62 38 Q76 52 76 66" stroke="${d}" stroke-width="2" fill="none" opacity=".5"/><path d="M138 38 Q124 52 124 66" stroke="${d}" stroke-width="2" fill="none" opacity=".5"/>
      <path d="M48 196 L92 196 L90 172 L50 172 Z M108 196 L152 196 L150 172 L110 172 Z" fill="${d}" opacity=".18"/></svg>`;
  }

  /* ---------- Warenkorb ---------- */
  const CART_KEY = 'shop-cart', ORDERS_KEY = 'shop-orders';
  let cart = [];   // { id, size, qty }
  try {
    const c = JSON.parse(localStorage.getItem(CART_KEY));
    if (Array.isArray(c)) cart = c.filter(l => byId(l.id) && byId(l.id).sizes.includes(l.size) && l.qty > 0).map(l => ({ id: l.id, size: l.size, qty: Math.min(MAX_QTY, l.qty | 0) }));
  } catch (e) { /* leerer Warenkorb */ }
  const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* ignorieren */ } };
  const subtotal = () => cart.reduce((s, l) => s + byId(l.id).price * l.qty, 0);
  const shipping = () => (cart.length === 0 || subtotal() >= FREE_SHIP ? 0 : SHIPPING);
  const itemCount = () => cart.reduce((s, l) => s + l.qty, 0);

  function addToCart(id, size) {
    const l = cart.find(x => x.id === id && x.size === size);
    if (l) l.qty = Math.min(MAX_QTY, l.qty + 1); else cart.push({ id, size, qty: 1 });
    saveCart(); renderCart();
  }
  function renderCart() {
    const n = itemCount(); $('cartcount').textContent = n; $('cartcount').hidden = n === 0;
    $('lines').innerHTML = cart.length ? cart.map((l, i) => {
      const p = byId(l.id);
      return `<div class="line"><div class="pic">${picture(p)}</div><div><h4>${esc(p.name)}</h4><div class="meta">Größe ${l.size} · ${eur(p.price)}</div>
        <div class="qty"><button data-q="${i}" data-d="-1" aria-label="weniger">−</button><span>${l.qty}</span><button data-q="${i}" data-d="1" aria-label="mehr">+</button></div>
        <button class="rm" data-rm="${i}">Entfernen</button></div><b>${eur(p.price * l.qty)}</b></div>`;
    }).join('') : '<div class="empty">Dein Warenkorb ist leer.</div>';
    const sub = subtotal(), sh = shipping(), rest = Math.max(0, FREE_SHIP - sub);
    $('sum').innerHTML = cart.length ? `
      <div class="ship">${rest > 0 ? `Noch ${eur(rest)} bis zum kostenlosen Versand` : 'Du bekommst kostenlosen Versand 🎉'}</div>
      <div class="bar2"><i style="width:${Math.min(100, sub / FREE_SHIP * 100)}%"></i></div>
      <div class="row"><span>Zwischensumme</span><span>${eur(sub)}</span></div>
      <div class="row"><span>Versand</span><span>${sh ? eur(sh) : 'gratis'}</span></div>
      <div class="row total"><span>Gesamt</span><span>${eur(sub + sh)}</span></div>
      <button class="primary" id="tocheckout">Zur Kasse</button>` : '';
  }
  $('lines').addEventListener('click', e => {
    const q = e.target.closest('[data-q]'), rm = e.target.closest('[data-rm]');
    if (q) { const l = cart[+q.dataset.q]; l.qty = Math.max(0, Math.min(MAX_QTY, l.qty + +q.dataset.d)); if (!l.qty) cart.splice(+q.dataset.q, 1); }
    else if (rm) cart.splice(+rm.dataset.rm, 1); else return;
    saveCart(); renderCart();
  });
  $('sum').addEventListener('click', e => { if (e.target.id === 'tocheckout') openCheckout(); });

  /* ---------- Übersicht ---------- */
  let cat = 'alle', sortBy = 'neu';
  function renderGrid() {
    let list = PRODUCTS.filter(p => cat === 'alle' || p.type === cat);
    if (sortBy === 'auf') list = [...list].sort((a, b) => a.price - b.price);
    if (sortBy === 'ab') list = [...list].sort((a, b) => b.price - a.price);
    if (sortBy === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'de'));
    $('count').textContent = list.length + (list.length === 1 ? ' Artikel' : ' Artikel');
    $('grid').innerHTML = list.map(p => `<article class="card"><div class="pic" data-open="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)} ansehen">${picture(p)}${p.old ? '<span class="tag">Angebot</span>' : ''}</div>
      <div class="info"><h3>${esc(p.name)}</h3><div class="meta">${p.type === 'tshirt' ? 'T-Shirt' : 'Hose'} · ${p.sizes.join(' ')}</div>
      <div class="price">${eur(p.price)}${p.old ? `<s>${eur(p.old)}</s>` : ''}</div><button class="primary" data-open="${p.id}">Größe wählen</button></div></article>`).join('');
  }
  $('nav').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.dataset.cat; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b)); renderGrid();
  });
  $('sort').addEventListener('change', e => { sortBy = e.target.value; renderGrid(); });
  $('grid').addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) openProduct(o.dataset.open); });
  $('grid').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.open) { e.preventDefault(); openProduct(e.target.dataset.open); } });

  /* ---------- Dialoge ---------- */
  let openEl = null, pick = null, cur = null;
  function show(el) { closeAll(); openEl = el; el.classList.add('open'); $('scrim').classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeAll() { ['modal', 'drawer', 'checkout'].forEach(id => $(id).classList.remove('open')); $('scrim').classList.remove('open'); document.body.style.overflow = ''; openEl = null; }
  $('scrim').addEventListener('click', closeAll); $('mclose').addEventListener('click', closeAll); $('dclose').addEventListener('click', closeAll);
  addEventListener('keydown', e => { if (e.key === 'Escape' && openEl) closeAll(); });
  $('cartbtn').addEventListener('click', () => { renderCart(); show($('drawer')); });

  function openProduct(id) {
    cur = byId(id); pick = null;
    $('mpic').innerHTML = picture(cur); $('mtitle').textContent = cur.name;
    $('mprice').innerHTML = eur(cur.price) + (cur.old ? `<s>${eur(cur.old)}</s>` : '');
    $('mdesc').textContent = cur.desc; $('merr').textContent = '';
    $('msizes').innerHTML = ALL_SIZES.map(s => `<button data-size="${s}" ${cur.sizes.includes(s) ? '' : 'disabled title="ausverkauft"'}>${s}</button>`).join('');
    show($('modal'));
  }
  $('msizes').addEventListener('click', e => {
    const b = e.target.closest('[data-size]'); if (!b || b.disabled) return;
    pick = b.dataset.size; $('merr').textContent = '';
    document.querySelectorAll('#msizes button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('madd').addEventListener('click', () => {
    if (!pick) { $('merr').textContent = 'Bitte wähle eine Größe.'; return; }
    addToCart(cur.id, pick); closeAll(); toast(`${cur.name} (${pick}) im Warenkorb`);
  });

  /* ---------- Kasse (Demo: keine echte Zahlung) ---------- */
  function openCheckout() {
    if (!cart.length) return;
    const sub = subtotal(), sh = shipping();
    $('checkout').innerHTML = `<h2 id="ctitle">Bestellung abschließen</h2><div class="meta" style="color:var(--muted)">${itemCount()} Artikel · Gesamt ${eur(sub + sh)} (inkl. MwSt.)</div>
      <form id="cform" novalidate>
        <label>Vorname<input name="first" required autocomplete="given-name" placeholder=" "></label>
        <label>Nachname<input name="last" required autocomplete="family-name" placeholder=" "></label>
        <label class="full">E-Mail<input name="mail" type="email" required autocomplete="email" placeholder=" "></label>
        <label class="full">Straße und Hausnummer<input name="street" required autocomplete="street-address" placeholder=" "></label>
        <label>PLZ<input name="zip" required pattern="[0-9]{5}" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder=" "></label>
        <label>Ort<input name="city" required autocomplete="address-level2" placeholder=" "></label>
        <label class="full">Zahlung<select name="pay"><option>Rechnung (Demo)</option><option>Vorkasse (Demo)</option></select></label>
        <div class="note">Das ist ein Demo-Shop: Es wird nichts bezahlt, versendet oder an einen Server geschickt. Die Bestellung bleibt nur in deinem Browser gespeichert.</div>
        <div class="err full" id="cerr" style="grid-column:1/-1"></div>
        <button type="button" class="ghost" id="cback">Zurück</button><button class="primary" type="submit">Jetzt kaufen · ${eur(sub + sh)}</button>
      </form>`;
    show($('checkout'));
    $('cback').addEventListener('click', () => { renderCart(); show($('drawer')); });
    $('cform').addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target; const bad = [...f.elements].find(x => x.name && x.willValidate && !x.checkValidity());
      if (bad) { $('cerr').textContent = 'Bitte prüfe deine Angaben: ' + (bad.parentElement.firstChild.textContent || bad.name) + '.'; bad.focus(); return; }
      placeOrder(Object.fromEntries(new FormData(f)));
    });
  }
  function placeOrder(data) {
    const sub = subtotal(), sh = shipping(), no = 'B-' + Date.now().toString(36).toUpperCase();
    const order = { no, date: new Date().toISOString(), customer: data, items: cart.map(l => ({ ...l, name: byId(l.id).name, price: byId(l.id).price })), subtotal: sub, shipping: sh, total: sub + sh };
    try { const o = JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; o.push(order); localStorage.setItem(ORDERS_KEY, JSON.stringify(o)); } catch (e) { /* ignorieren */ }
    cart = []; saveCart(); renderCart();
    $('checkout').innerHTML = `<div class="done"><div class="ok">✅</div><h2>Danke, ${esc(data.first)}!</h2><p>Deine Bestellung <b>${no}</b> über <b>${eur(order.total)}</b> ist eingegangen (Demo).<br>Eine Bestätigung ginge an ${esc(data.mail)}.</p><button class="primary" id="cdone">Weiter einkaufen</button></div>`;
    $('cdone').addEventListener('click', closeAll);
  }

  let tt;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

  renderGrid(); renderCart();
  window.__shop = { PRODUCTS, get cart() { return cart; }, addToCart, subtotal, shipping, placeOrder };
})();
</script>
</body>
</html>
