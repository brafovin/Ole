<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ping Pong</title>
<style>
  :root{--bg:#0b1020;--panel:#172036;--text:#f8fafc;--muted:#94a3b8;--yellow:#facc15;--red:#ef4444;--blue:#38bdf8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
  body{display:grid;place-items:center}
  #stage{position:relative;aspect-ratio:8/5;width:min(100vw,calc(100vh * 1.6));width:min(100vw,calc(100dvh * 1.6));background:#0e1a33;overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
  .tools button{background:rgba(15,23,42,.6);border:2px solid rgba(255,255,255,.22);border-radius:12px;font-size:17px;padding:5px 11px;font-weight:800}
  .tools button[hidden]{display:none}
  @media (max-width:560px){.tools{top:4px;right:4px;gap:4px}.tools button{font-size:13px;padding:3px 7px;border-radius:9px}}
  .overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;background:rgba(8,13,28,.82);z-index:2;padding:16px}
  .overlay[hidden]{display:none}
  h1{margin:0;font-size:clamp(34px,8vw,68px);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.03em;
     color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000}
  h1 span{color:var(--yellow)}
  h2{margin:0;font-size:clamp(28px,6vw,52px);text-transform:uppercase;color:var(--yellow)}
  p{margin:0}
  .muted{color:var(--muted);font-size:clamp(12px,1.7vw,15px)}
  .group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .group label{color:var(--muted);font-weight:700;font-size:13px;margin-right:4px}
  .opt{background:#243252;border-radius:12px;padding:9px 16px;font-weight:800}
  .opt.on{background:var(--blue);color:#06233a}
  .big{background:linear-gradient(#fde047,#facc15 55%,#eab308);color:#422006;font-weight:900;font-size:clamp(20px,4vw,30px);padding:12px 46px;border-radius:16px;box-shadow:0 5px 0 #854d0e;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #854d0e}
  .alt{background:#334155;color:#fff;font-weight:800;padding:10px 22px;border-radius:12px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:800;color:#e2e8f0;font-size:14px}
  .stats b{color:var(--yellow)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="800" height="500"></canvas>
  <div class="tools">
    <button id="pausebtn" title="Pause (P)" hidden>⏸</button>
    <button id="mute" title="Ton (M)">🔊</button>
    <button id="fs" title="Vollbild (F)">⛶</button>
  </div>

  <div id="menu" class="overlay">
    <h1>Ping <span>Pong</span></h1>
    <p class="muted">Spiele Tischtennis gegen einen Bot – gewinne mit zwei Punkten Vorsprung!</p>
    <div class="group"><label>Bot</label><button class="opt" data-diff="leicht">Leicht</button><button class="opt" data-diff="normal">Normal</button><button class="opt" data-diff="schwer">Schwer</button></div>
    <div class="group"><label>Punkte</label><button class="opt" data-to="7">7</button><button class="opt" data-to="11">11</button><button class="opt" data-to="21">21</button></div>
    <button class="big" id="start">Start</button>
    <div class="stats" id="stats"></div>
    <p class="muted">Maus / Finger ziehen oder W·S / ↑↓ · Leertaste: Aufschlag · P: Pause · F: Vollbild · M: Ton</p>
  </div>

  <div id="pause" class="overlay" hidden>
    <h2>Pause</h2>
    <div class="row"><button class="big" id="resume">Weiter</button><button class="alt" id="tomenu1">Menü</button></div>
  </div>

  <div id="result" class="overlay" hidden>
    <h2 id="rtitle">Sieg!</h2>
    <p id="rscore" style="font-size:clamp(22px,5vw,40px);font-weight:900"></p>
    <p class="muted" id="rinfo"></p>
    <div class="row"><button class="big" id="again">Nochmal</button><button class="alt" id="tomenu2">Menü</button></div>
  </div>
</div>

<script>
(() => {
  /* ---------- Maße (logische Einheiten, Bild 800 x 500) ---------- */
  const W = 800, H = 500, TAU = Math.PI * 2;
  const TB = { l: 36, r: 764, t: 84, b: 462 };            // Tischfläche
  const BR = 9, PW = 14, PH = 92, PXP = 66, PXB = 734;    // Ballradius, Schläger
  const SERVE_SPEED = 340, HIT_BOOST = 38, MAX_SPEED = 1120, MAX_ANGLE = 58 * Math.PI / 180;
  const DIFFS = {
    // miss: Chance, sich bei einem Ball zu verschätzen; missSpeed: zusätzlich bei hohem Balltempo
    leicht: { name: 'Leicht', spd: 300, react: .26,  err: 52, miss: .18, missSpeed: .35, aim: 0,   predict: false, serve: 1.3 },
    normal: { name: 'Normal', spd: 440, react: .15,  err: 38, miss: .17, missSpeed: .30, aim: .25, predict: true,  serve: 1.0 },
    schwer: { name: 'Schwer', spd: 880, react: .04,  err: 6,  miss: .015, missSpeed: .10, aim: .85, predict: true, serve: .8 },
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------- Speicher ---------- */
  const KEY = 'pingpong-save';
  let save = { diff: 'normal', to: 11, wins: 0, losses: 0, best: 0, played: 0 };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') save = {
      diff: DIFFS[s.diff] ? s.diff : 'normal', to: [7, 11, 21].includes(s.to) ? s.to : 11,
      wins: Math.max(0, s.wins | 0), losses: Math.max(0, s.losses | 0), best: Math.max(0, s.best | 0), played: Math.max(0, s.played | 0),
      mute: !!s.mute,
    };
  } catch (e) { /* ohne Speicher weiterspielen */ }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ignorieren */ } };

  /* ---------- Zustand ---------- */
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  let state = 'menu';              // menu | serve | play | point | over
  let paused = false;
  const P = { y: H / 2, target: H / 2, vy: 0 }, B = { y: H / 2, target: H / 2, vy: 0, think: 0, serveT: 0, slip: 0, incoming: false };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: SERVE_SPEED };
  let score = { p: 0, b: 0 }, WIN = 11, D = DIFFS.normal;
  let rally = 0, bestRally = 0, first = 'p', server = 'p', pointT = 0, serveT = 0, banner = '', shake = 0, time = 0;
  let trail = [], parts = [];
  const keys = { up: false, down: false };

  /* ---------- Ton ---------- */
  let ac = null;
  function beep(freq, dur, type = 'square', vol = .08, slide = 0) {
    if (save.mute) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) { /* kein Ton möglich */ }
  }
  const sndHit = s => beep(520 + s * .25, .07, 'square', .09, -200);
  const sndWall = () => beep(260, .06, 'triangle', .1, -80);
  const sndScore = win => { beep(win ? 660 : 220, .12, 'sine', .12); setTimeout(() => beep(win ? 880 : 165, .18, 'sine', .12), 110); };

  /* ---------- Spielablauf ---------- */
  function serverFor(sp, sb) {                       // 2 Aufschläge je Spieler, ab Gleichstand jeder Punkt
    const other = s => (s === 'p' ? 'b' : 'p'), total = sp + sb, t0 = 2 * (WIN - 1);
    if (sp >= WIN - 1 && sb >= WIN - 1) { const base = Math.floor(t0 / 2) % 2 === 0 ? first : other(first); return (total - t0) % 2 === 0 ? base : other(base); }
    return Math.floor(total / 2) % 2 === 0 ? first : other(first);
  }
  function newMatch() {
    WIN = save.to; D = DIFFS[save.diff]; score = { p: 0, b: 0 }; rally = 0; bestRally = 0; first = 'p';
    P.y = P.target = B.y = B.target = H / 2; trail = []; parts = [];
    startServe();
  }
  function startServe() {
    server = serverFor(score.p, score.b); state = 'serve'; serveT = 0; rally = 0; trail = [];
    ball.speed = SERVE_SPEED; ball.vx = ball.vy = 0; B.serveT = D.serve;
    placeBall();
  }
  function placeBall() { // der Aufschläger hält den Ball vor seinem Schläger
    ball.x = server === 'p' ? PXP + PW / 2 + BR + 2 : PXB - PW / 2 - BR - 2; ball.y = server === 'p' ? P.y : B.y;
  }
  function launch() {
    const dir = server === 'p' ? 1 : -1, ang = rnd(-.28, .28);
    ball.speed = SERVE_SPEED; ball.vx = dir * Math.cos(ang) * ball.speed; ball.vy = Math.sin(ang) * ball.speed;
    state = 'play'; sndHit(0);
  }
  function spark(x, y, n, color, sp = 160) {
    for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(40, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.25, .5), max: .5, color }); }
  }
  function endPoint(who) {
    score[who]++; sndScore(who === 'p');
    if (rally > bestRally) bestRally = rally;
    const lead = score[who] - score[who === 'p' ? 'b' : 'p'];
    if (score[who] >= WIN && lead >= 2) return endMatch(who === 'p');
    state = 'point'; pointT = 1.05; banner = who === 'p' ? 'Punkt für dich!' : 'Punkt für den Bot';
  }
  function endMatch(win) {
    state = 'over'; save.played++; if (win) save.wins++; else save.losses++; save.best = Math.max(save.best, bestRally); persist();
    $('rtitle').textContent = win ? 'Sieg!' : 'Niederlage'; $('rtitle').style.color = win ? '#facc15' : '#fca5a5';
    $('rscore').textContent = score.p + ' : ' + score.b;
    $('rinfo').textContent = `Bot: ${D.name} · längster Ballwechsel: ${bestRally} · Siege ${save.wins} / Niederlagen ${save.losses}`;
    $('result').hidden = false; $('pausebtn').hidden = true;
  }

  /* ---------- Physik ---------- */
  function paddleHit(side, px, py) {
    const pad = side === 'p' ? P : B, face = side === 'p' ? PXP + PW / 2 : PXB - PW / 2;
    const edge = side === 'p' ? ball.x - BR : ball.x + BR, prevEdge = side === 'p' ? px - BR : px + BR;
    const crossed = side === 'p' ? (prevEdge >= face && edge < face) : (prevEdge <= face && edge > face);
    if (!crossed) return false;
    const t = (face - prevEdge) / (edge - prevEdge), yc = py + (ball.y - py) * t;
    if (Math.abs(yc - pad.y) > PH / 2 + BR * .8) return false;           // daneben
    const rel = clamp((yc - pad.y) / (PH / 2 + BR), -1, 1), ang = rel * MAX_ANGLE, dir = side === 'p' ? 1 : -1;
    // Ab 24 Schlägen im selben Ballwechsel wird der Ball weiter schneller, damit lange Ballwechsel enden
    const cap = Math.min(1500, MAX_SPEED + Math.max(0, rally - 24) * 24);
    let sp = Math.min(cap, ball.speed + HIT_BOOST + Math.min(70, Math.abs(pad.vy) * .06));
    let vx = dir * Math.cos(ang) * sp, vy = Math.sin(ang) * sp + pad.vy * .2;
    const m = Math.hypot(vx, vy); vx *= sp / m; vy *= sp / m;
    if (Math.abs(vx) < sp * .38) { vx = dir * sp * .38; vy = Math.sign(vy || 1) * Math.sqrt(sp * sp - vx * vx); }
    ball.speed = sp; ball.vx = vx; ball.vy = vy; ball.x = face + dir * BR; ball.y = yc;
    rally++; sndHit(sp); spark(face, yc, 8 + (sp > 650 ? 8 : 0), '#fde68a');
    if (sp > 650) shake = .18;
    return true;
  }
  function stepBall(dt) {
    const px = ball.x, py = ball.y;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.y < TB.t + BR) { ball.y = TB.t + BR + (TB.t + BR - ball.y); ball.vy = Math.abs(ball.vy); sndWall(); spark(ball.x, TB.t, 4, '#bfdbfe', 90); }
    else if (ball.y > TB.b - BR) { ball.y = TB.b - BR - (ball.y - (TB.b - BR)); ball.vy = -Math.abs(ball.vy); sndWall(); spark(ball.x, TB.b, 4, '#bfdbfe', 90); }
    if (ball.vx < 0) paddleHit('p', px, py); else paddleHit('b', px, py);
    if (ball.x < TB.l - 40) endPoint('b'); else if (ball.x > TB.r + 40) endPoint('p');
  }
  // Wohin fliegt der Ball auf Höhe des Bot-Schlägers (mit Banden-Abprallern)?
  function predictY() {
    const face = PXB - PW / 2 - BR;
    if (ball.vx <= 0) return null;
    const t = (face - ball.x) / ball.vx, L = TB.b - TB.t - 2 * BR, y0 = ball.y - (TB.t + BR) + ball.vy * t;
    const m = ((y0 % (2 * L)) + 2 * L) % (2 * L);
    return TB.t + BR + (m > L ? 2 * L - m : m);
  }

  /* ---------- Bot ---------- */
  function botThink(dt) {
    // Kommt ein neuer Ball auf den Bot zu, entscheidet er einmal, ob er sich verschätzt (häufiger bei hohem Tempo)
    const incoming = state === 'play' && ball.vx > 0;
    if (incoming && !B.incoming) {
      const p = D.miss + D.missSpeed * clamp((ball.speed - 450) / 500, 0, 1);
      B.slip = Math.random() < p ? (Math.random() < .5 ? -1 : 1) * rnd(75, 150) : 0;
    }
    B.incoming = incoming;
    B.think -= dt;
    if (B.think <= 0) {
      B.think = D.react;
      if (state === 'play' && ball.vx > 0 && (D.predict || ball.x > W * .42)) {
        const y = D.predict ? predictY() : ball.y;
        // Schwerere Bots zielen: der Ball soll an die Seite, von der du weit weg bist
        const aimOff = -D.aim * (P.y < H / 2 ? 1 : -1) * (PH / 2 + BR) * .85;
        B.target = y + B.slip + aimOff + rnd(-D.err, D.err) + rnd(-1, 1) * PH * .12;
      } else if (state !== 'serve') B.target = H / 2 + Math.sin(time * 1.3) * 40;
    }
  }
  function moveBot(dt) {
    const prev = B.y; B.y += clamp(B.target - B.y, -D.spd * dt, D.spd * dt);
    B.y = clamp(B.y, TB.t + PH / 2, TB.b - PH / 2); B.vy = (B.y - prev) / dt;
  }

  /* ---------- Update ---------- */
  function update(dt) {
    time += dt; shake = Math.max(0, shake - dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    if (state === 'menu' || state === 'over' || paused) return;
    // Spieler-Schläger
    if (keys.up) P.target -= 820 * dt; if (keys.down) P.target += 820 * dt;
    P.target = clamp(P.target, TB.t + PH / 2, TB.b - PH / 2);
    const pp = P.y; P.y += clamp(P.target - P.y, -1500 * dt, 1500 * dt); P.vy = (P.y - pp) / dt;
    botThink(dt); moveBot(dt);
    if (state === 'serve') {
      serveT += dt; placeBall();
      if (server === 'b' && serveT >= B.serveT) launch();
      if (server === 'p' && serveT >= 3) launch();                        // Auto-Aufschlag nach 3 s
    } else if (state === 'play') {
      trail.push({ x: ball.x, y: ball.y }); if (trail.length > 14) trail.shift();
      // bei hohem Tempo in Teilschritten rechnen
      const n = Math.max(1, Math.ceil(ball.speed * dt / 7)); for (let i = 0; i < n && state === 'play'; i++) stepBall(dt / n);
    } else if (state === 'point') {
      pointT -= dt; if (pointT <= 0) startServe();
    }
  }

  /* ---------- Zeichnen ---------- */
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function drawPaddle(side, y, color, dark) {
    const x = side === 'p' ? PXP : PXB, dir = side === 'p' ? -1 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(ctx, x - PW / 2 + 5, y - PH / 2 + 8, PW, PH, 7); ctx.fill();
    ctx.fillStyle = '#c08457'; rr(ctx, x + dir * 6 - (dir < 0 ? 26 : 0), y - 6, 26, 12, 4); ctx.fill();              // Griff
    ctx.lineWidth = 2.4; ctx.strokeStyle = '#1b1230'; ctx.stroke();
    const g = ctx.createLinearGradient(x - PW / 2, 0, x + PW / 2, 0); g.addColorStop(0, color); g.addColorStop(1, dark);
    ctx.fillStyle = g; rr(ctx, x - PW / 2, y - PH / 2, PW, PH, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(ctx, x - PW / 2 + 2, y - PH / 2 + 5, 3.5, PH - 10, 2); ctx.fill();
  }
  function scoreBoard() {
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const txt = (s, x, y, size, col) => { ctx.font = `900 ${size}px system-ui,sans-serif`; ctx.lineWidth = size / 6; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y); };
    txt(score.p, W / 2 - 70, 58, 54, '#fca5a5'); txt(score.b, W / 2 + 70, 58, 54, '#e2e8f0');
    ctx.font = '800 13px system-ui,sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText('DU', W / 2 - 70, 76); ctx.fillText('BOT · ' + D.name.toUpperCase(), W / 2 + 70, 76);
    if (state !== 'menu' && state !== 'over') { // Aufschlag-Marke
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(server === 'p' ? W / 2 - 112 : W / 2 + 112, 44, 6, 0, TAU); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
    }
    ctx.font = '700 12px system-ui,sans-serif'; ctx.fillStyle = 'rgba(203,213,225,.9)'; ctx.fillText('bis ' + WIN + ' · Vorsprung 2', W / 2, 22);
  }
  function draw() {
    const r = cv.getBoundingClientRect(), k = Math.min(2.5, Math.max(1, Math.round(r.width * (devicePixelRatio || 1) / W * 2) / 2));
    if (cv.width !== Math.round(W * k)) { cv.width = Math.round(W * k); cv.height = Math.round(H * k); }
    ctx.setTransform(k, 0, 0, k, 0, 0);
    const sx = shake > 0 ? rnd(-3, 3) * shake * 8 : 0, sy = shake > 0 ? rnd(-3, 3) * shake * 8 : 0;
    ctx.save(); ctx.translate(sx, sy);
    // Raum
    const bg = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, 520); bg.addColorStop(0, '#1d3a6b'); bg.addColorStop(1, '#0a1226');
    ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
    // Tisch
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(ctx, TB.l + 6, TB.t + 14, TB.r - TB.l, TB.b - TB.t, 14); ctx.fill();
    const tg = ctx.createLinearGradient(0, TB.t, 0, TB.b); tg.addColorStop(0, '#2563b8'); tg.addColorStop(1, '#1b4f98');
    ctx.fillStyle = tg; rr(ctx, TB.l, TB.t, TB.r - TB.l, TB.b - TB.t, 12); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#f8fafc'; ctx.stroke();
    ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(TB.l + 6, (TB.t + TB.b) / 2); ctx.lineTo(TB.r - 6, (TB.t + TB.b) / 2); ctx.stroke();
    // Netz
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(W / 2 + 3, TB.t - 6, 6, TB.b - TB.t + 12);
    for (let y = TB.t - 6; y < TB.b + 6; y += 8) { ctx.fillStyle = ((y / 8) | 0) % 2 ? '#e2e8f0' : '#94a3b8'; ctx.fillRect(W / 2 - 3, y, 6, 8); }
    ctx.fillStyle = '#475569'; ctx.fillRect(W / 2 - 6, TB.t - 12, 12, 8); ctx.fillRect(W / 2 - 6, TB.b + 4, 12, 8);
    // Schläger, Ball
    drawPaddle('b', B.y, '#374151', '#111827'); drawPaddle('p', P.y, '#f87171', '#b91c1c');
    for (let i = 0; i < trail.length; i++) { const a = (i + 1) / trail.length; ctx.fillStyle = `rgba(255,255,255,${a * .28})`; ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, BR * (.4 + a * .5), 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(ball.x + 4, ball.y + 7, BR, BR * .7, 0, 0, TAU); ctx.fill();
    const bgrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, BR + 1); bgrad.addColorStop(0, '#fff'); bgrad.addColorStop(1, '#fde68a');
    ctx.fillStyle = bgrad; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, TAU); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1b1230'; ctx.stroke();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1; ctx.restore();
    scoreBoard();
    ctx.textAlign = 'center';
    if (state === 'play' && rally >= 3) { ctx.font = '800 14px system-ui,sans-serif'; ctx.fillStyle = '#fde68a'; ctx.fillText('Ballwechsel: ' + rally, W / 2, H - 14); }
    if (state === 'serve') {
      ctx.font = '800 20px system-ui,sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
      const t = server === 'p' ? 'Dein Aufschlag – Leertaste oder Klick' : 'Aufschlag Bot …'; ctx.strokeText(t, W / 2, H - 22); ctx.fillText(t, W / 2, H - 22);
    }
    if (state === 'point') { ctx.font = '900 34px system-ui,sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fde047'; ctx.strokeText(banner, W / 2, H / 2 + 6); ctx.fillText(banner, W / 2, H / 2 + 6); }
  }

  /* ---------- Eingabe & Oberfläche ---------- */
  function setY(clientY) { const r = cv.getBoundingClientRect(); P.target = clamp((clientY - r.top) / r.height * H, TB.t + PH / 2, TB.b - PH / 2); }
  cv.addEventListener('pointermove', e => setY(e.clientY));
  cv.addEventListener('pointerdown', e => { setY(e.clientY); if (e.pointerType === 'touch') cv.setPointerCapture(e.pointerId); serveNow(); });
  function serveNow() { if (state === 'serve' && server === 'p' && !paused) launch(); }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
    if (k === 'arrowup' || k === 'w') keys.up = true;
    if (k === 'arrowdown' || k === 's') keys.down = true;
    if (e.repeat) return;
    if (k === ' ') { if (state === 'menu') startGame(); else serveNow(); }
    if (k === 'p' || k === 'escape') togglePause();
    if (k === 'm') toggleMute();
    if (k === 'f') toggleFs();
  });
  addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'arrowup' || k === 'w') keys.up = false; if (k === 'arrowdown' || k === 's') keys.down = false; });
  addEventListener('blur', () => { if (state === 'serve' || state === 'play' || state === 'point') setPause(true); });

  function setPause(v) { if (state === 'menu' || state === 'over') return; paused = v; $('pause').hidden = !v; }
  function togglePause() { setPause(!paused); }
  function startGame() { $('menu').hidden = true; $('result').hidden = true; $('pause').hidden = true; paused = false; $('pausebtn').hidden = false; newMatch(); }
  function toMenu() { state = 'menu'; paused = false; $('pause').hidden = true; $('result').hidden = true; $('menu').hidden = false; $('pausebtn').hidden = true; renderMenu(); }
  function renderMenu() {
    document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('on', b.dataset.diff === save.diff));
    document.querySelectorAll('[data-to]').forEach(b => b.classList.toggle('on', +b.dataset.to === save.to));
    $('stats').innerHTML = `<span>Siege <b>${save.wins}</b></span><span>Niederlagen <b>${save.losses}</b></span><span>Längster Ballwechsel <b>${save.best}</b></span>`;
    $('mute').textContent = save.mute ? '🔇' : '🔊';
  }
  function toggleMute() { save.mute = !save.mute; persist(); renderMenu(); }
  const fsOk = !!document.fullscreenEnabled;
  function toggleFs() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (fsOk) document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) { /* ignorieren */ } }
  $('fs').hidden = !fsOk;
  document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => { save.diff = b.dataset.diff; persist(); renderMenu(); }));
  document.querySelectorAll('[data-to]').forEach(b => b.addEventListener('click', () => { save.to = +b.dataset.to; persist(); renderMenu(); }));
  $('start').addEventListener('click', startGame); $('again').addEventListener('click', startGame);
  $('resume').addEventListener('click', () => setPause(false));
  $('tomenu1').addEventListener('click', toMenu); $('tomenu2').addEventListener('click', toMenu);
  $('pausebtn').addEventListener('click', togglePause); $('mute').addEventListener('click', toggleMute); $('fs').addEventListener('click', toggleFs);

  let last = performance.now();
  function frame(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }
  renderMenu();
  requestAnimationFrame(frame);
  /*HOOK*/
})();
</script>
</body>
</html>
