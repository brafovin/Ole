<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Rare Form Lager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: Kopfzeile + Kennzahlenleiste, darunter Tabs. Bestand = Liste je Produkt, aufklappbar zu einer Farbe×Größe-Matrix. Lieferungen = Liste offener Bestellungen mit Ankunftsdatum. */
  :root{
    --bg:#e9e7e2; --panel:#f6f5f2; --panel-2:#efede8; --ink:#1a1a1c; --muted:#66625b; --line:#d6d2c8;
    --accent:#1a1a1c; --on-accent:#f6f5f2; --gold:#7d6419;
    --ok:#23774b; --low:#9a6208; --out:#b9302f; --inc:#245f9e;
    --ok-bg:color-mix(in srgb,var(--ok) 13%,var(--panel)); --low-bg:color-mix(in srgb,var(--low) 15%,var(--panel));
    --out-bg:color-mix(in srgb,var(--out) 13%,var(--panel)); --inc-bg:color-mix(in srgb,var(--inc) 13%,var(--panel));
    --logo-filter:invert(1);
    --display:'Archivo','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d0d0f; --panel:#161619; --panel-2:#1d1d21; --ink:#f1eee8; --muted:#9a958d; --line:#2b2b31;
    --accent:#e4d3a8; --on-accent:#17130a; --gold:#e4d3a8;
    --ok:#4dbd86; --low:#e2a63a; --out:#f0706f; --inc:#6ea8e6; --logo-filter:none; color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#0d0d0f; --panel:#161619; --panel-2:#1d1d21; --ink:#f1eee8; --muted:#9a958d; --line:#2b2b31;
    --accent:#e4d3a8; --on-accent:#17130a; --gold:#e4d3a8;
    --ok:#4dbd86; --low:#e2a63a; --out:#f0706f; --inc:#6ea8e6; --logo-filter:none; color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--display);font-stretch:100%;padding-inline:max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-left))}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto;padding-block:0 56px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left)))}
  .bar{max-width:1100px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;flex-wrap:wrap}

  .sp{flex:1}
  .tabs{display:flex;gap:4px;background:var(--panel-2);padding:3px;border-radius:10px}
  .tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
  .tabs .n{font-family:var(--mono);font-size:12px;background:color-mix(in srgb,currentColor 18%,transparent);padding:0 6px;border-radius:99px}

  .stat{padding:14px 16px;min-width:0;border-left:1px solid var(--line)}

  .stat span{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-top:3px;font-weight:500}

  .stat small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  @media (max-width:760px){.stat{padding:11px 14px}.stat b{font-size:22px}.stat small{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)}.stat:last-child{grid-column:1/-1;border-left:0}}

  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
  .search{position:relative;flex:1 1 220px;min-width:0}

  .thumb{width:64px;aspect-ratio:1313/1198;border-radius:8px;object-fit:cover;background:var(--panel-2);display:block}

  .pn h3{margin:0;font-size:16px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}

  .strip i{width:10px;height:10px;border-radius:2px;background:var(--ok)}

  .tot{text-align:right;white-space:nowrap}

  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.low{background:var(--low-bg);color:var(--low)}
  .pill.out{background:var(--out-bg);color:var(--out)} .pill.inc{background:var(--inc-bg);color:var(--inc)}
  .eta{font-size:13px;margin-top:5px;display:block;color:var(--muted)}
  .eta b{color:var(--ink);font-weight:650}
  .chev{width:16px;height:16px;transition:transform .15s;color:var(--muted)}

  .body{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px}
  .facts{display:flex;gap:6px 26px;flex-wrap:wrap}

  .facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
  .facts dd{margin:0;font-family:var(--mono);font-size:17px}
  .facts{margin:0}
  .shopbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;border-radius:10px;padding:9px 14px;white-space:nowrap}
  .shopbtn svg{width:15px;height:15px}
  .prog{grid-column:1/-1;display:grid;gap:5px}
  .prog .track{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}

  .prog .lab b{color:var(--ink);font-weight:650}
  .matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
  tr:last-child>*{border-bottom:0}
  thead th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;background:var(--panel-2);white-space:nowrap}
  th.rowh{text-align:left;white-space:nowrap;font-weight:650;background:var(--panel-2);position:sticky;left:0}
  .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
  .cell{display:inline-block;min-width:54px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
  .cell.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
  .cell.low{border-color:var(--low);background:var(--low-bg);color:var(--low)} .cell.out{border-color:var(--out);background:var(--out-bg);color:var(--out)}
  .cell.off{text-decoration:line-through}
  .more{display:block;font-family:var(--mono);font-size:11.5px;color:var(--inc);margin-top:3px;min-height:15px}
  .legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;gap:6px;align-items:center}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .orders{display:grid;gap:10px;margin-top:18px}
  .ord{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto;align-items:start}
  .ord h3{margin:0;font-size:16px;font-weight:650;overflow-wrap:anywhere}
  .ord .no{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .ord ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .ord li{background:var(--panel-2);border-radius:6px;padding:3px 9px;font-size:13px}
  .ord li b{font-family:var(--mono);font-weight:500}
  .ord .when{text-align:right;min-width:0}
  .ord .when b{display:block;font-size:17px;font-weight:700}
  .ord .when span{display:block;font-size:13px;color:var(--muted)}
  .ord.late .when b{color:var(--out)}
  .empty{color:var(--muted);text-align:center;padding:48px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
  h2.sec{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 0}

  .note{color:var(--muted);font-size:12.5px}
  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:10px 20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  footer p{margin:0;max-width:64ch}
  .themebtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0;display:grid;place-items:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header><div class="bar">
  <div class="brand"><img src="img/mark.png" alt=""><div><h1>Rare Form Lager</h1><small>Bestand &amp; Lieferzeiten · Beispieldaten</small></div></div>
  <div class="sp"></div>
  <div class="tabs" role="tablist" aria-label="Bereich">
    <button role="tab" id="tab-stock" aria-selected="true" data-tab="stock">Bestand</button>
    <button role="tab" id="tab-orders" aria-selected="false" data-tab="orders">Unterwegs <span class="n" id="ordn">0</span></button>
  </div>
  <a class="shopbtn" id="shopbtn" href="../shop/index.html">Zum Shop <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h9v9M16 4L5 15"/></svg></a>
  <button class="themebtn" id="themebtn" type="button" aria-label="Hell oder dunkel umschalten" title="Hell / dunkel"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
</div></header>

<main class="wrap">
  <section class="stats" id="stats" aria-label="Kennzahlen"></section>

  <section id="view-stock">
    <div class="tools">
      <div class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Produkt, Farbe oder Größe suchen" aria-label="Lager durchsuchen" autocomplete="off"></div>
      <select id="cat" aria-label="Kategorie"></select>
      <select id="sort" aria-label="Sortierung">
        <option value="urg">Dringend zuerst</option><option value="name">Name A–Z</option><option value="low">Kleinster Bestand</option><option value="high">Größter Bestand</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div class="list" id="list" style="margin-top:12px"></div>
  </section>

  <section id="view-orders" hidden></section>

  <footer>
    <p>Beispieldaten: Bestände, Mindestmengen, Lieferzeiten und die Lieferungen unterwegs sind erfundene Startwerte. Die App zeigt nur an, bestellt wird hier nichts.</p>
  </footer>
</main>


<script>
(() => {

rs": ["silver", "black"], "sizes": ["Einheitsgröße"], "offered": ["Einheitsgröße"], "thumbs": {"silver": "img/rf6-silver.webp", "black": "img/rf6-black.webp"}}, {"id": "rf7", "type": "haarpflege", "name": "Rare Form Texture Powder", "colors": [""], "sizes": [""], "offered": [""], "thumbs": {"": "img/rf7-x.webp"}}, {"id": "rf13", "type": "jacken", "name": "Rare Form Zip Hoodie mit Fellrand", "colors": ["black", "white"], "sizes": ["XS", "S", "M", "L", "XL", "XXL"], "offered": ["XS", "S", "M", "L", "XL", "XXL"], "thumbs": {"black": "img/rf13-black.webp", "white": "img/rf13-white.webp"}}, {"id": "rf12", "type": "schuhe", "name": "Rare Form Fluffy Slides", "colors": ["black", "white", "grey"], "sizes": ["38–39", "42–43"], "offered": ["38–39", "42–43"], "thumbs": {"black": "img/rf12-black.webp", "white": "img/rf12-white.webp", "grey": "img/rf12-grey.webp"}}, {"id": "rf11", "type": "parfum", "name": "Rare Form Eau de Parfum (100 ml)", "colors": [""], "sizes": [""], "offered": [""], "thumbs": {"": "img/rf11-x.webp"}}];
  const TYPES = { tshirt: 'T-Shirts', jacken: 'Jacken', hose: 'Hosen', zubehoer: 'Accessoires', haarpflege: 'Haarpflege', schuhe: 'Schuhe', parfum: 'Parfüm' };
  const COLORS = { '': '', white: 'Weiß', black: 'Schwarz', grey: 'Grau', darkgrey: 'Dunkelgrau', silver: 'Silber' };
  const SW = { white: '#f4f2ee', black: '#161616', grey: '#8d8d8f', darkgrey: '#48484a', silver: '#c4c7cc' };
  const LEAD0 = { tshirt: 14, jacken: 21, hose: 18, zubehoer: 10, haarpflege: 7, schuhe: 25, parfum: 12 };
  const KEY = 'rare-form-lager-theme';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sizeLabel = s => (s === 'Einheitsgröße' ? 'Einheitsgr.' : s === '' ? 'Stück' : s);
  const vkey = (p, c, s) => `${p.id}|${c}|${s}`;
  const variants = p => p.colors.flatMap(c => p.sizes.map(s => ({ key: vkey(p, c, s), c, s, offered: p.offered.includes(s) })));
  const byId = id => P.find(p => p.id === id);
  const vname = (p, v) => [COLORS[v.c], v.s && sizeLabel(v.s)].filter(Boolean).join(' · ') || 'Standard';

  /* ---------- Datum ---------- */
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = day0(d); x.setDate(x.getDate() + n); return x; };
  const diffDays = d => Math.round((day0(d) - day0(new Date())) / 864e5);
  const fmt = d => new Date(d).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
  const rel = d => { const n = diffDays(d); return n === 0 ? 'heute' : n === 1 ? 'morgen' : n > 1 ? `in ${n} Tagen` : n === -1 ? 'seit gestern überfällig' : `seit ${-n} Tagen überfällig`; };

  /* ---------- Beispieldaten ---------- */
  function rng(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
  function seed() {
    const st = { stock: {}, min: {}, lead: {}, orders: [] };
    P.forEach((p, pi) => {
      st.min[p.id] = p.sizes.length === 1 && p.colors.length === 1 ? 10 : 5;
      st.lead[p.id] = LEAD0[p.type] + (pi % 3) * 2;
      variants(p).forEach(v => {

    const mk = (pid, ago, lead, n) => {
      const p = byId(pid), low = variants(p).filter(v => v.offered && st.stock[v.key] <= st.min[pid]).slice(0, n);
      if (!low.length) return;
      st.orders.push({ id: 'B-' + (2041 + st.orders.length), pid, created: addDays(new Date(), -ago).toISOString(), eta: addDays(new Date(), lead).toISOString(), lines: low.map(v => ({ key: v.key, qty: 24 })) });
    };
    mk('rf13', 6, 15, 3); mk('rf1', 11, 3, 3); mk('rf12', 18, 7, 2); mk('rf10', 3, 15, 2);
    return st;
  }
  const S = seed();

  /* ---------- Berechnungen ---------- */
  const qty = k => S.stock[k] || 0;
  const status = (q, min) => (q === 0 ? 'out' : q <= min ? 'low' : 'ok');
  const incoming = k => S.orders.reduce((n, o) => n + o.lines.reduce((m, l) => m + (l.key === k ? l.qty : 0), 0), 0);
  const nextEta = k => { const e = S.orders.filter(o => o.lines.some(l => l.key === k)).map(o => new Date(o.eta)).sort((a, b) => a - b)[0]; return e || null; };
  function prodInfo(p) {
    const vs = variants(p), min = S.min[p.id];
    const info = vs.map(v => ({ ...v, q: qty(v.key), st: status(qty(v.key), min), inc: incoming(v.key), eta: nextEta(v.key) }));
    const total = info.reduce((n, v) => n + v.q, 0);
    const out = info.filter(v => v.st === 'out'), low = info.filter(v => v.st === 'low');
    const open = S.orders.filter(o => o.pid === p.id);
    const need = out.concat(low).filter(v => !v.inc);                       // knapp oder leer und noch nichts bestellt
    const back = out.filter(v => v.eta).map(v => v.eta).sort((a, b) => a - b)[0];
    return { info, total, out, low, open, need, back, min, lead: S.lead[p.id] };
  }

  /* ---------- Ansicht ---------- */
  let tab = 'stock', filter = 'alle', cat = 'alle', sortBy = 'urg', term = '';
  const openSet = new Set();
  const fold = x => String(x).toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '');

  function renderStats() {
    const all = P.map(prodInfo); const vs = all.flatMap(a => a.info);
    const pcs = vs.reduce((n, v) => n + v.q, 0), out = vs.filter(v => v.st === 'out').length, low = vs.filter(v => v.st === 'low').length;
    const onway = S.orders.reduce((n, o) => n + o.lines.reduce((m, l) => m + l.qty, 0), 0);
    const nx = S.orders.map(o => new Date(o.eta)).sort((a, b) => a - b)[0];
    $('stats').innerHTML = `
      <div class="stat"><b>${pcs}</b><span>Stück im Lager</span><small>${vs.length} Varianten, ${P.length} Produkte</small></div>
      <div class="stat out"><b>${out}</b><span>Leer</span><small>${out ? 'Varianten ohne Bestand' : 'nichts leer'}</small></div>
      <div class="stat low"><b>${low}</b><span>Knapp</span><small>unter dem Mindestbestand</small></div>
      <div class="stat inc"><b>${onway}</b><span>Unterwegs</span><small>${S.orders.length} offene Lieferung${S.orders.length === 1 ? '' : 'en'}</small></div>
      <div class="stat"><b style="font-size:20px;padding-top:5px">${nx ? fmt(nx) : '–'}</b><span>Nächste Lieferung</span><small>${nx ? rel(nx) : 'keine offen'}</small></div>`;
    $('ordn').textContent = S.orders.length;
  }

  function etaLine(a) {
    if (a.out.length || a.low.length) {
      const parts = [];
      if (a.back) parts.push(`${a.out.length ? 'Wieder da ab' : 'Nachschub'} <b>${fmt(a.back)}</b> (${rel(a.back)})`);
      if (a.need.length) parts.push(`${a.need.length} Variante${a.need.length === 1 ? '' : 'n'} ohne Lieferung · normale Lieferzeit <b>${a.lead} Tage</b>`);
      return parts.length ? `<span class="eta">${parts.join(' · ')}</span>` : '';
    }
    return `<span class="eta">Normale Lieferzeit <b>${a.lead} Tage</b></span>`;
  }

  function matrix(p, a) {
    const cols = p.sizes;
    const head = `<tr><th class="rowh"></th>${cols.map(s => `<th>${esc(sizeLabel(s))}</th>`).join('')}</tr>`;
    const rows = p.colors.map(c => `<tr><th class="rowh" scope="row">${c ? `<i class="sw" style="background:${SW[c]}"></i>${COLORS[c]}` : 'Bestand'}</th>${p.sizes.map(s => {
      const v = a.info.find(x => x.c === c && x.s === s);
      return `<td><div class="cell ${v.st}${v.offered ? '' : ' off'}" ${v.offered ? '' : 'title="Im Shop als ausverkauft markiert"'} aria-label="${esc(p.name)} ${esc(vname(p, v))}: ${v.q} Stück">${v.q}</div>
        <span class="more">${v.inc ? `+${v.inc} · ${fmt(v.eta).replace(/^\S+\s/, '')}` : ''}</span></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="matrix-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }

  function prodCard(p) {
    const a = prodInfo(p), open = openSet.has(p.id);
    const pill = a.out.length ? `<span class="pill out">${a.out.length} leer</span>` : '';
    const pill2 = a.low.length ? `<span class="pill low">${a.low.length} knapp</span>` : '';
    const pill3 = a.open.length ? `<span class="pill inc">${a.open.reduce((n, o) => n + o.lines.reduce((m, l) => m + l.qty, 0), 0)} unterwegs</span>` : '';
    const pillOk = !a.out.length && !a.low.length ? '<span class="pill ok">Bestand ok</span>' : '';
    const thumb = p.thumbs[p.colors[0]] || Object.values(p.thumbs)[0];
    return `<article class="prod" data-p="${p.id}">
      <button class="head" type="button" data-toggle="${p.id}" aria-expanded="${open}">
        <img class="thumb" src="${thumb}" alt="" loading="lazy">
        <div class="pn"><h3>${esc(p.name)}</h3>
          <div class="sub"><span>${TYPES[p.type]}</span>${pill}${pill2}${pill3}${pillOk}</div>
          <div class="strip" aria-hidden="true">${a.info.map(v => `<i class="${v.st}${v.inc ? ' inc' : ''}"></i>`).join('')}</div>
          ${etaLine(a)}</div>
        <div class="tot"><b>${a.total}</b><span>Stück</span><svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg></div>
      </button>
      ${open ? `<div class="body">
        <dl class="facts"><div><dt>Mindestbestand</dt><dd>${a.min} Stück</dd></div><div><dt>Normale Lieferzeit</dt><dd>${a.lead} Tage</dd></div>${a.open.length ? `<div><dt>Nächste Lieferung</dt><dd>${fmt(a.open.map(o => new Date(o.eta)).sort((x, y) => x - y)[0])}</dd></div>` : ''}</dl>
        ${matrix(p, a)}
        <div class="legend"><span><i style="background:var(--ok)"></i>ok</span><span><i style="background:var(--low)"></i>knapp (bis ${a.min})</span><span><i style="background:var(--out)"></i>leer</span><span style="color:var(--inc)">+Zahl = unterwegs mit Ankunftsdatum</span>${p.sizes.some(s => !p.offered.includes(s)) ? '<span>durchgestrichen = im Shop ausverkauft</span>' : ''}</div>
      </div>` : ''}
    </article>`;
  }

  function renderList() {
    const toks = fold(term).split(/\s+/).filter(Boolean);
    let items = P.map(p => ({ p, a: prodInfo(p) })).filter(({ p, a }) => {
      if (cat !== 'alle' && p.type !== cat) return false;
      if (filter === 'leer' && !a.out.length) return false;
      if (filter === 'knapp' && !a.low.length && !a.out.length) return false;
      if (filter === 'unterwegs' && !a.open.length) return false;
      const hay = fold([p.name, TYPES[p.type], ...p.colors.map(c => COLORS[c]), ...p.sizes].join(' '));
      return toks.every(t => hay.includes(t));
    });
    const urg = x => x.a.out.length * 100 + x.a.low.length;
    items.sort(sortBy === 'name' ? (x, y) => x.p.name.localeCompare(y.p.name, 'de') : sortBy === 'low' ? (x, y) => x.a.total - y.a.total : sortBy === 'high' ? (x, y) => y.a.total - x.a.total : (x, y) => urg(y) - urg(x) || x.a.total - y.a.total);
    $('list').innerHTML = items.length ? items.map(({ p }) => prodCard(p)).join('') : '<div class="empty">Dazu gibt es nichts im Lager. Such mit einem anderen Begriff oder nimm einen Filter heraus.</div>';
  }

  function renderChips() {
    const cnt = { alle: P.length, leer: 0, knapp: 0, unterwegs: 0 };
    P.forEach(p => { const a = prodInfo(p); if (a.out.length) cnt.leer++; if (a.low.length || a.out.length) cnt.knapp++; if (a.open.length) cnt.unterwegs++; });
    const lab = { alle: 'Alle', leer: 'Mit leeren Varianten', knapp: 'Knapp oder leer', unterwegs: 'Mit Lieferung unterwegs' };
    $('chips').innerHTML = Object.keys(lab).map(k => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${lab[k]} · ${cnt[k]}</button>`).join('');
  }

  function renderOrders() {
    const open = [...S.orders].sort((a, b) => new Date(a.eta) - new Date(b.eta));
    const card = o => {
      const p = byId(o.pid), n = o.lines.reduce((m, l) => m + l.qty, 0), late = diffDays(o.eta) < 0;
      const span = Math.max(1, diffDays(o.eta) - diffDays(o.created)), done = Math.max(0, Math.min(1, (0 - diffDays(o.created)) / span));
      const left = diffDays(o.eta);
      return `<article class="ord${late ? ' late' : ''}" data-o="${o.id}">
        <div><div class="no">${o.id} · bestellt ${fmt(o.created)}</div><h3>${esc(p.name)}</h3>
          <ul>${o.lines.map(l => { const v = variants(p).find(x => x.key === l.key); return `<li>${esc(vname(p, v))} <b>×${l.qty}</b></li>`; }).join('')}</ul></div>
        <div class="when"><b>${fmt(o.eta)}</b><span>${rel(o.eta)}</span><span class="num">${n} Stück</span></div>
        <div class="prog"><div class="track" role="img" aria-label="${Math.round(done * 100)} Prozent der Lieferzeit vorbei"><i style="width:${Math.round(done * 100)}%"></i></div>
          <div class="lab"><span>Lieferzeit gesamt <b>${span} Tage</b></span><span>${left > 0 ? `noch <b>${left} Tag${left === 1 ? '' : 'e'}</b>` : left === 0 ? '<b>kommt heute</b>' : `<b>${-left} Tag${left === -1 ? '' : 'e'} überfällig</b>`}</span></div></div>
      </article>`;
    };
    $('view-orders').innerHTML = `<h2 class="sec" style="margin-top:18px">Unterwegs (${open.length})</h2>
      <div class="orders">${open.length ? open.map(card).join('') : '<div class="empty">Zurzeit ist nichts unterwegs.</div>'}</div>`;
  }

  function render() {
    renderStats(); renderChips(); renderList(); renderOrders();
    $('view-stock').hidden = tab !== 'stock'; $('view-orders').hidden = tab !== 'orders';
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  }

  /* ---------- Bedienung (nur ansehen) ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab],[data-toggle],[data-f],#themebtn'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); }
    else if (t.dataset.toggle) { const id = t.dataset.toggle; openSet.has(id) ? openSet.delete(id) : openSet.add(id); render(); const b = document.querySelector(`[data-toggle="${id}"]`); if (b) b.focus({ preventScroll: true }); }
    else if (t.dataset.f) { filter = t.dataset.f; render(); }
    else if (t.id === 'themebtn') { const r = document.documentElement, dark = r.getAttribute('data-theme') ? r.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); try { localStorage.setItem(KEY, dark ? 'light' : 'dark'); } catch (er) { /* ignorieren */ } }
  });
  $('q').addEventListener('input', e => { term = e.target.value; renderList(); });
  $('sort').addEventListener('change', e => { sortBy = e.target.value; renderList(); });
  $('cat').innerHTML = '<option value="alle">Alle Kategorien</option>' + Object.keys(TYPES).filter(k => P.some(p => p.type === k)).map(k => `<option value="${k}">${TYPES[k]}</option>`).join('');
  $('cat').addEventListener('change', e => { cat = e.target.value; renderList(); });

  try { const th = localStorage.getItem(KEY); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) { /* ignorieren */ }
  if (P.length) openSet.add([...P].sort((a, b) => { const f = x => { const i = prodInfo(x); return i.out.length * 100 + i.low.length; }; return f(b) - f(a); })[0].id);
  render();
})();
</script>

</body></html>
